<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>推荐结果 · 记忆库推荐</title>
<script>
  (function () {
    var t = "dark";
    try { t = localStorage.getItem("memsite-theme") || "dark"; } catch (e) {}
    if (location.hash.indexOf("light") > -1) t = "light";
    if (t === "dark") document.documentElement.classList.add("theme-dark");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  /* 结果页（2026-10-28 定的结构，见 docs/前端/结果页内容草稿.md）：
     概况 → 为您挑出的 N 个（前 3 张展开，其余点开看）→ 搭配方案 → 其余也符合条件的 → 为什么是这些 → 改进建议 → 页脚 */
  .topbar { background: linear-gradient(var(--paper) 70%, transparent); }
  /* 对齐：序号单独一列 28px，名字、正文、建议都从序号列＋12px 处开始；纵向间距只用 6、12、24 的倍数 */
  :root { --rank-w: 28px; --indent: calc(var(--rank-w) + var(--s-2)); }
  .sheet { max-width: 640px; margin: 0 auto; padding: var(--s-6) var(--gutter) var(--s-6); animation: arrive .7s var(--ease-out) both; }
  @keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
  .loading { color: var(--ink-faint); }

  /* ---------- 概况 ---------- */
  .eyebrow { margin: 0; color: var(--ink-faint); }
  h1 {
    margin: var(--s-1) 0 0;
    font-family: var(--font-zh); font-weight: 600;
    font-size: var(--fs-h1); line-height: var(--lh-h1); letter-spacing: var(--ls-zh-title);
  }
  h1 .num { font-family: var(--font-en); font-weight: 600; color: var(--bulb); }
  .lead { margin: var(--s-2) 0 0; color: var(--ink-soft); max-width: var(--measure); }
  .verified { margin: var(--s-2) 0 0; color: var(--ink-faint); }

  /* ---------- 区块标题：英文小字＋中文标题，上方一道细线 ---------- */
  .block { margin-top: var(--s-6); }
  .block > header { padding-top: var(--s-2); border-top: var(--line) solid var(--rule); }
  .block > header .caption { margin: 0; color: var(--ink-faint); }
  h2 {
    margin: 0;
    font-family: var(--font-zh); font-weight: 600;
    font-size: var(--fs-h3); line-height: var(--lh-h3); letter-spacing: var(--ls-zh-title);
  }
  .block > header p.sub { margin: 0; color: var(--ink-soft); font-size: var(--fs-small); line-height: var(--lh-small); }

  /* ---------- 推荐卡片 ---------- */
  .picks { list-style: none; margin: 0; padding: 0; }
  .pick { padding: var(--s-3) 0; border-bottom: var(--line) solid var(--rule); }
  .pick:last-child { border-bottom: 0; }
  .pick-head { display: flex; align-items: baseline; gap: var(--s-2); }
  .rank { flex: none; width: var(--rank-w); font-family: var(--font-en); font-size: var(--fs-small); color: var(--bulb); font-variant-numeric: tabular-nums; }
  .pick-title { flex: 1; min-width: 0; }
  h3 {
    margin: 0; display: inline;
    font-family: var(--font-body); font-weight: 600;
    font-size: var(--fs-h3); line-height: 30px;
  }
  .cat { display: block; color: var(--ink-faint); }
  .nm-note { margin-left: .5em; font-family: var(--font-body); font-weight: 400; font-size: var(--fs-small); color: var(--ink-faint); }
  .pick-body { padding-left: var(--indent); }   /* 和名字左边对齐，序号单独一列 */
  .summary { margin: var(--s-2) 0 0; color: var(--ink-soft); max-width: var(--measure); }
  .reasons { list-style: none; margin: var(--s-2) 0 0; padding: 0; }
  .reasons li { position: relative; padding-left: 18px; }
  .reasons li + li { margin-top: var(--s-1); }
  .reasons li::before { content: ""; position: absolute; left: 0; top: 10px; width: 5px; height: 5px; background: var(--bulb); }
  .facts { margin: var(--s-2) 0 0; display: grid; grid-template-columns: 4em 1fr; column-gap: var(--s-2); row-gap: var(--s-1); font-size: var(--fs-small); line-height: var(--lh-small); }
  .facts dt { color: var(--ink-faint); font-family: var(--font-zh); letter-spacing: var(--ls-zh-label); }
  .facts dd { margin: 0; color: var(--ink-soft); }
  .facts dd ul { list-style: none; margin: 0; padding: 0; }
  .parts { margin: var(--s-2) 0 0; font-size: var(--fs-small); line-height: var(--lh-small); color: var(--ink-soft); }
  .parts .k { color: var(--ink-faint); }
  .go { display: inline-flex; align-items: center; gap: var(--s-1); min-height: var(--tap); margin-top: var(--s-1); color: var(--ink); text-decoration: none; border-bottom: var(--line) solid transparent; }
  .go span { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .go svg { width: 12px; height: 12px; flex: none; }

  /* 第 4 个起：只露出一行，点开是完整卡片 */
  details.pick > summary { list-style: none; cursor: pointer; }
  li:has(> details.pick) { padding: var(--s-2) 0; border-bottom: var(--line) solid var(--rule); }
  li:has(> details.pick):last-child { border-bottom: 0; }
  details.pick { padding: 0; border: 0; }
  details.pick[open] { padding-bottom: var(--s-2); }
  details.pick > summary::-webkit-details-marker { display: none; }
  details.pick > summary .pick-head { min-height: var(--tap); align-items: baseline; }
  details.pick > summary h3 { font-size: var(--fs-h4); line-height: var(--lh-h4); }
  details.pick > summary .brief { display: block; margin-top: 0; color: var(--ink-faint); font-size: var(--fs-small); line-height: var(--lh-small); }
  details.pick[open] > summary .brief { display: none; }
  /* 箭头本身是块，图标不落在文字基线上，否则会比文字中线低半行 */
  .chev { flex: none; display: flex; width: 12px; height: 12px; margin-left: auto; align-self: center; color: var(--ink-faint); transition: transform .3s var(--ease-out); }
  .chev svg { display: block; width: 12px; height: 12px; }
  /* 折叠卡片的箭头对齐名字那一行，不对齐名字加简介两行的中间 */
  .pick-head .chev { align-self: flex-start; margin-top: calc((var(--lh-h4) - 12px) / 2); }
  details[open] > summary .chev { transform: rotate(90deg); }

  /* ---------- 搭配方案 ---------- */
  .combos { list-style: none; margin: var(--s-2) 0 0; padding: 0; }
  .combos li { padding: var(--s-2) 0; border-bottom: var(--line) solid var(--rule); }
  .combos li:last-child { border-bottom: 0; }
  .combos .t { color: var(--ink-faint); }
  .combos .names { margin: 0; font-family: var(--font-body); font-weight: 600; }
  .combos .plus { color: var(--bulb); padding: 0 var(--s-1); font-weight: 400; }
  .combos .d { margin: var(--s-1) 0 0; color: var(--ink-soft); font-size: var(--fs-small); line-height: var(--lh-small); max-width: var(--measure); }

  /* ---------- 折叠区（其余项目、为什么是这些、被排除的、答卷） ---------- */
  /* 其余项目、为什么是这些：两块挨着放，用细线隔开，不各自空一大段 */
  .block.tight { margin-top: 0; border-top: var(--line) solid var(--rule); }
  .block.tight.first { margin-top: var(--s-6); }
  .block.tight.why { border-bottom: var(--line) solid var(--rule); }
  details.fold > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; gap: var(--s-2);
    min-height: var(--tap);
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary .label { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .rest { list-style: none; margin: var(--s-1) 0 0; padding: 0; }
  .rest li { padding: var(--s-1) 0; border-bottom: var(--line) solid var(--rule); font-size: var(--fs-small); line-height: var(--lh-small); }
  .rest li:last-child { border-bottom: 0; }
  .rest a { color: var(--ink); font-family: var(--font-body); font-size: var(--fs-body); }
  .rest .s { display: block; color: var(--ink-faint); }

  .why p, .why li { color: var(--ink-soft); }
  .why p { margin: var(--s-2) 0 0; max-width: var(--measure); }
  .why ul { list-style: none; margin: var(--s-1) 0 0; padding: 0; }
  .why li { position: relative; padding-left: 18px; margin-top: var(--s-1); font-size: var(--fs-small); line-height: var(--lh-small); max-width: var(--measure); }
  .why li::before { content: ""; position: absolute; left: 0; top: 11px; width: 6px; height: 1px; background: var(--ink-faint); }
  .why .warn { padding-left: var(--s-2); border-left: var(--line-bold) solid var(--dusty-pink); }
  .why .relax li .n { color: var(--ink); font-variant-numeric: tabular-nums; }
  .excluded { margin-top: var(--s-2); }
  .excluded dl { margin: 0; font-size: var(--fs-small); line-height: var(--lh-small); }
  .excluded dt { margin-top: var(--s-2); color: var(--ink-soft); }
  .excluded dd { margin: 0; color: var(--ink-faint); }

  /* ---------- 改进建议 ---------- */
  .advice { list-style: none; margin: var(--s-2) 0 0; padding: 0; counter-reset: adv; }
  .advice li { padding: var(--s-2) 0; border-bottom: var(--line) solid var(--rule); }
  .advice li:last-child { border-bottom: 0; }
  .advice h3 { display: block; font-family: var(--font-zh); font-size: var(--fs-h4); line-height: var(--lh-h4); letter-spacing: var(--ls-zh-title); }
  .advice .help { display: block; margin-top: 0; color: var(--ink-faint); font-size: var(--fs-small); line-height: var(--lh-small); font-weight: 400; letter-spacing: 0; }
  .advice p { margin: var(--s-1) 0 0; max-width: var(--measure); }
  .advice .eg { color: var(--ink-soft); font-size: var(--fs-small); line-height: var(--lh-small); }
  .advice .eg .k { color: var(--ink-faint); }
  .addon { margin-top: var(--s-4); }
  .addon > p { margin: 0; color: var(--ink-soft); font-size: var(--fs-small); line-height: var(--lh-small); max-width: var(--measure); }
  h4.addon-t { margin: 0; font-family: var(--font-zh); font-weight: 600; font-size: var(--fs-h4); line-height: var(--lh-h4); letter-spacing: var(--ls-zh-title); }

  /* ---------- 页脚 ---------- */
  .foot { margin-top: var(--s-6); padding-top: var(--s-3); border-top: var(--line) solid var(--rule); }
  .actions { margin-top: 0; display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .foot .actions { display: grid; grid-template-columns: repeat(3, 1fr); }
  .foot .btn { padding: 0 var(--s-1); white-space: nowrap; }

  /* 长段正文两端对齐，标题和列表项左对齐（负责人 2026-10-28 定） */
  .summary, details.pick > summary .brief, .rest .s, .combos .d, .advice p:not(.eg), .why p, .addon > p { text-align: justify; }
  .btn {
    min-height: var(--tap); padding: 0 var(--s-3);
    display: inline-flex; align-items: center; justify-content: center;
    border: var(--line) solid var(--ink-soft); color: var(--ink);
    font-family: var(--font-zh); font-size: var(--fs-small); letter-spacing: var(--ls-zh-label);
    text-decoration: none;
    transition: background-color .25s, color .25s;
  }
  .btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  @media (hover: hover) { .btn:hover { background: var(--paper-shade); } .btn.primary:hover { background: var(--ink-soft); } }
  .answers dl { margin: 0; }
  .answers dt { margin-top: var(--s-2); font-family: var(--font-zh); font-size: var(--fs-small); line-height: var(--lh-small); color: var(--ink-soft); }
  .answers dt .no { color: var(--ink-faint); margin-right: var(--s-1); }
  .answers dd { margin: 0; color: var(--ink-faint); font-size: var(--fs-small); line-height: var(--lh-small); }

</style>
</head>

<script type="module">
  import { checkCondition, createRuleEngine } from "../engine/index.js";
  import { edgeLines, adviceItems, splitName } from "./assets/result-text.js";

  const sheet = document.getElementById("sheet");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const nm = (n) => { const [a, b] = splitName(n); return esc(a) + (b ? `<span class="nm-note">${esc(b)}</span>` : ""); };
  const nmPlain = (n) => { const [a, b] = splitName(n); return b ? `${a} · ${b}` : a; };
  const sentence = (s) => { s = String(s ?? "").trim(); return !s || /[。！？]$/.test(s) ? s : s + "。"; };
  const CAT = { "需写代码（开发者向）": "开发者向，需要写代码", "边缘项（存的不是对话记忆）": "边缘项，存的不是对话记忆", "做法（笔记软件当记忆）": "做法：用笔记软件当记忆" };
  const catText = (c) => CAT[c] || String(c ?? "").replace(/（(.+)）$/, "，$1");
  const ARROW = `<svg viewBox="0 0 12 12" aria-hidden="true"><polyline points="3.5,1.5 8,6 3.5,10.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"/></svg>`;
  const OUT = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 1.5h6.5V8M10.5 1.5 2 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="square" stroke-linejoin="miter"/></svg>`;

  const cfg = await fetch("../data/questionnaire/questions.json").then((r) => r.json());
  const byQ = Object.fromEntries(cfg.questions.map((q) => [q.id, q]));
  let st = { answers: {}, free: {} };
  try { st = { ...st, ...JSON.parse(localStorage.getItem("memsite-quiz-v2")) }; } catch (e) {}

  let data;
  try {
    data = await fetch("data/projects.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
  } catch (e) {
    sheet.innerHTML = `<p class="loading caption-zh">项目数据还没打包，请用 npm run site 启动预览。</p>`;
    throw e;
  }
  if (!Object.keys(st.answers).length) {
    sheet.innerHTML = `<p class="eyebrow caption">Results</p><h1>还没有答卷</h1><p class="lead">先答完问卷，这里会列出适合您的记忆库。</p><p class="actions"><a class="btn primary" href="quiz.html">开始答题</a></p>`;
    throw new Error("no answers");
  }

  const answers = Object.fromEntries(Object.entries(st.answers).map(([id, v]) => [id, byQ[id]?.type === "single" ? v[0] : v]));
  const r = createRuleEngine({ questionnaire: cfg, settings: data.settings }).recommend(answers, data.projects, { free: st.free });
  const byId = Object.fromEntries(data.projects.map((p) => [p.id, p]));
  const edges = edgeLines(r.results, byId);
  const advice = adviceItems(answers, cfg, r.results, byId);
  const val = (id, f) => byId[id]?.normalized?.[f]?.value;

  /* ---------- 搭配方案的说明句 ---------- */
  const STAGE = { capture: "写入", consolidate: "整理", retrieve: "召回", forget: "遗忘", review: "查看修改" };
  const gist = (id) => String(byId[id]?.info?.summary?.value || "").split(/[：；，。]/)[0];
  const stageList = (arr) => arr.map((s) => STAGE[s]).join("、");
  // 用户在用的几个用顿号连起来，只标一次“您在用”
  function comboNames(c) {
    const cur = c.parts.filter((p) => p.current), add = c.parts.filter((p) => !p.current);
    const curHtml = cur.length ? cur.map((p) => (p.id ? nm(p.name) : esc(p.name))).join("、") + (cur[0].id ? `<span class="nm-note">您在用</span>` : "") : "";
    return [curHtml, ...add.map((p) => nm(p.name))].filter(Boolean).join(`<span class="plus">＋</span>`);
  }
  // 两个方案的说明句本身就是对比：句首点出这个方案胜过另一个的地方，冒号后写分工，比另一个少了环节时在句末说明。
  // 安装门槛和花销变化大，排在最后
  const PLAN = ["方案一", "方案二"];
  const DIFF = { low: 0, medium: 1, high: 2 };
  const stagesIn = (c) => Object.keys(STAGE).filter((s) => c.parts.some((p) => p.stages.includes(s)));
  function comboFacts(c) {
    const adds = c.parts.filter((p) => p.id && !p.current);
    return {
      keep: c.type === "current",
      installs: adds.length,
      stages: stagesIn(c).length,
      paired: c.via === "pairs",
      diff: Math.max(...adds.map((p) => DIFF[val(p.id, "difficulty")] ?? 1)),
      free: adds.every((p) => [].concat(val(p.id, "spend") || []).includes("none")),
    };
  }
  function comboEdge(c, other) {
    const x = comboFacts(c), y = comboFacts(other), out = [];
    if (x.keep && !y.keep) out.push("不用换掉现在用的");
    if (!x.keep && y.keep) out.push("另起一套");
    if (x.installs < y.installs) out.push(`只装 ${x.installs} 个项目`);
    if (x.stages === 5 && y.stages < 5) out.push("覆盖全流程");
    else if (x.stages > y.stages) out.push("覆盖的环节更多");
    if (x.paired && !y.paired) out.push("设计上搭配使用");
    if (x.diff < y.diff) out.push("门槛更低");
    if (x.free && !y.free) out.push("不用额外花钱");
    if (!out.length && x.installs > y.installs) out.push("分工更细");
    return out;
  }
  function comboBody(c, saidPaired = false) {
    const N = (p) => splitName(p.name)[0];
    const parts = c.parts, last = parts[parts.length - 1], B = N(last);
    const base = parts.filter((p) => p.current);
    const baseStages = [...new Set(base.flatMap((p) => p.stages))];
    const why = {
      pairs: saidPaired ? (gist(last.id) ? `，${B} ${gist(last.id)}` : "") : `，两者设计上就是搭配使用的${gist(last.id) ? `，${B} ${gist(last.id)}` : ""}`,
      stages: `，补上${stageList(last.stages.filter((s) => !baseStages.includes(s)))}`,
      concern: `，针对您在第 8 题选的“${c.label}”`,
      markdown: `，它把记忆存成 Markdown 文件，可以和笔记放在一起`,
      top: c.base === "native" ? `，记忆就不只存在客户端里` : "",
    }[c.via] || "";
    if (c.type === "current") {
      const lead = c.base === "project" ? `在您正在用的 ${base.map(N).join("、")} 上加 ${B}`
        : c.base === "notes" ? `保留您的笔记库，再加 ${B}` : `继续用现在的客户端，再接上 ${B}`;
      return lead + why;
    }
    if (c.type === "complete") {
      const tail = { pairs: saidPaired ? `${B} ${gist(last.id) || "和它搭配"}` : `${B} 和它设计上就是搭配使用的${gist(last.id) ? "，" + gist(last.id) : ""}`,
        concern: `${B} 针对您在第 8 题选的“${c.label}”`, addon: `${B} 是可以加装的${c.label}` }[c.via] || `再加上 ${B}`;
      return `${N(parts[0])} 一个项目包办写入到查看修改，${tail}`;
    }
    const cover = stagesIn(c).length === 5 ? "，合起来覆盖全流程" : "";
    if (c.via === "pairs" && !saidPaired) return `${parts.map(N).join("、")} 设计上就是搭配使用的${cover}`;
    let have = [];
    return parts.map((p, i) => {
      const add = p.stages.filter((s) => !have.includes(s));
      have = [...have, ...add];
      return `${N(p)} ${i === 0 ? "负责" : "补上"}${stageList(add)}`;
    }).join("，") + cover;
  }
  // 对比是双向的：两边都说得出胜过对方的地方才给方案二，否则只留方案一，不编号、不写对比
  const combos = r.combos.length === 2 && comboEdge(r.combos[0], r.combos[1]).length && comboEdge(r.combos[1], r.combos[0]).length
    ? r.combos : r.combos.slice(0, 1);
  function comboText(c, i) {
    const other = combos[1 - i];
    if (!other) return comboBody(c) + "。";
    const edge = comboEdge(c, other);
    const lack = stagesIn(other).filter((s) => !stagesIn(c).includes(s));
    const tail = lack.length ? `；比${PLAN[1 - i]}少了${stageList(lack)}${lack.length > 1 ? "这几个环节" : "这一环节"}` : "";
    return (edge.length ? edge.join("、") + "：" : "") + comboBody(c, edge.includes("设计上搭配使用")) + tail + "。";
  }

  /* ---------- 一张卡片 ---------- */
  // 门槛、花销、需要、注意不用句号：句号处换行，换行前用“；”，最后一句不加标点
  function factLines(texts) {
    const segs = segsOf(texts);
    return `<ul>${segs.map((s, i) => `<li>${esc(s)}${i < segs.length - 1 ? "；" : ""}</li>`).join("")}</ul>`;
  }
  const segsOf = (texts) => [].concat(texts).flatMap((t) => String(t ?? "").split("。"))
    .map((s) => s.trim().replace(/[。；，]+$/, "")).filter(Boolean);
  function factsOf(x) {
    const diff = [], need = [], warn = [];
    for (const c of x.cautions) {
      if (c.startsWith("上手门槛：")) diff.push(c.slice(5));
      else if (c.startsWith("需要：")) need.push(c.slice(3));
      else warn.push(c);
    }
    if (x.unknowns.length) warn.push(`说明里没写清，需自行确认：${x.unknowns.join("、")}`);
    const safety = byId[x.id]?.safety_note;
    if (safety) warn.push(safety);
    const spend = String(val(x.id, "spend_note") || "").replace(/^需要一些额外花销来搭配这个项目：/, "");
    return [["门槛", diff.slice(0, 1)], ["花销", spend ? [spend] : []], ["需要", need], ["注意", warn]].filter(([, v]) => v.length);
  }
  function cardBody(x) {
    let h = "";
    if (x.summary) h += `<p class="summary">${esc(sentence(x.summary))}</p>`;
    const lines = [...x.reasons, ...(edges[x.id] ? [edges[x.id]] : [])];   // “相比其它几个”接在推荐理由后面，同样的样式
    if (lines.length) h += `<ul class="reasons">${lines.map((t) => `<li>${esc(String(t).replace(/。$/, ""))}</li>`).join("")}</ul>`;
    h += `<dl class="facts">${factsOf(x).map(([k, v]) => `<dt>${k}</dt><dd>${factLines(v)}</dd>`).join("")}</dl>`;
    if (x.parts?.length) h += `<p class="parts"><span class="k">可以搭配的连接工具：</span>${x.parts.map((p) => nm(p.name)).join("、")}</p>`;
    if (x.repo_url) h += `<a class="go caption-zh" href="${esc(x.repo_url)}" target="_blank" rel="noopener"><span>${x.role === "method" ? "查看做法说明" : "查看项目"}</span>${OUT}</a>`;
    return h;
  }
  const head = (x, i, folded) => `<div class="pick-head"><span class="rank">${pad(i + 1)}</span><div class="pick-title"><h3>${nm(x.name)}</h3>` +
    (folded ? `<span class="brief">${esc(sentence(x.summary))}</span>` : `<span class="cat caption-zh">${esc(catText(x.category))}</span>`) + `</div>${folded ? `<span class="chev">${ARROW}</span>` : ""}</div>`;

  /* ---------- 概况 ---------- */
  const alone = r.narrowed_by.filter((x) => x.only > 0);
  const narrow = (alone.length ? alone : [...r.narrowed_by].sort((x, y) => y.total - x.total)).slice(0, 3);
  const few = r.total_kept < 5;
  let html = `<p class="eyebrow caption">Results</p>`;
  if (r.results.length) {
    html += `<h1>为您挑出 <span class="num">${r.results.length}</span> 个记忆库</h1>`;
    html += `<p class="lead">筛选的硬条件：可用设备、所用 LLM／Agent。<br>筛选的软条件：对记忆生成、演化、检索的偏好。</p>`;
  } else {
    html += `<h1>暂时没有完全符合的</h1><p class="lead">您的条件放在一起，收录的项目里还没有能同时满足的。下面列出放宽哪些条件就能有选择。</p>`;
  }
  html += `<p class="verified caption-zh">项目描述基于 README 生成，核实于 2026 年 10 月</p>`;

  /* ---------- 推荐 ---------- */
  if (r.results.length) {
    html += `<section class="block" id="picks" aria-labelledby="picksT"><header><p class="caption">Picks</p><h2 id="picksT">推荐</h2></header><ol class="picks">`;
    r.results.forEach((x, i) => {
      html += i < 3
        ? `<li class="pick">${head(x, i, false)}<div class="pick-body">${cardBody(x)}</div></li>`
        : `<li><details class="pick"><summary>${head(x, i, true)}</summary><div class="pick-body">${cardBody(x)}</div></details></li>`;
    });
    html += `</ol></section>`;
  }

  /* ---------- 搭配方案 ---------- */
  if (combos.length) {
    html += `<section class="block" aria-labelledby="combosT"><header><p class="caption">Combinations</p><h2 id="combosT">搭配方案</h2></header><ul class="combos">`;
    combos.forEach((c, i) => {
      html += `<li>${combos.length > 1 ? `<span class="t caption-zh">${PLAN[i]}</span>` : ""}<p class="names">` +
        comboNames(c) + `</p><p class="d">${esc(comboText(c, i))}</p></li>`;
    });
    html += `</ul></section>`;
  }

  /* ---------- 其余也符合条件的 ---------- */
  if (r.more?.length) {
    html += `<section class="block tight first"><details class="fold"><summary><span class="label">其余 ${r.more.length} 个也符合条件</span><span class="chev">${ARROW}</span></summary><ul class="rest">` +
      r.more.map((x) => `<li><a href="${esc(x.repo_url)}" target="_blank" rel="noopener">${nm(x.name)}</a><span class="s">${esc(sentence(x.summary))}</span></li>`).join("") +
      `</ul></details></section>`;
  }

  /* ---------- 为什么是这些 ---------- */
  html += `<section class="block tight why${r.more?.length ? "" : " first"}" id="why"><details class="fold"${few || r.conflicts.length ? " open" : ""}><summary><span class="label">为什么是这些</span><span class="chev">${ARROW}</span></summary>`;
  html += `<p>收录的 ${data.projects.length} 个项目里，符合您条件的有 ${r.total_kept} 个。</p>`;
  if (narrow.length) {
    html += `<p>排除较多的条件：</p><ul>` + narrow.map((x) =>
      `<li>第 ${esc(x.number)} 题“${esc(x.short)}”` +
      (x.selected.length ? `，您选了${esc(x.selected.join("、"))}` : "") +
      `，该选项排除了 ${alone.length ? x.only : x.total} 个项目</li>`).join("") + `</ul>`;
  }
  if (r.conflicts.length) html += `<p class="warn">${r.conflicts.map((c) => esc(c.message)).join("<br>")}</p>`;
  if (r.notices.length) html += `<ul>${r.notices.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>`;
  if (r.relax.length) html += `<p>放宽这些条件，就能多出一些选择：</p><ul class="relax">` + r.relax.map((x) => `<li>${esc(x.label)}：<span class="n">${x.count}</span> 个</li>`).join("") + `</ul>`;
  if (r.excluded.length) {
    const groups = {};
    for (const e of r.excluded) (groups[e.reason] ||= []).push(e.name);
    html += `<details class="fold excluded"><summary><span class="label caption-zh">被排除的 ${r.excluded.length} 个及原因</span><span class="chev">${ARROW}</span></summary><dl>` +
      Object.entries(groups).sort((a, b) => b[1].length - a[1].length).map(([why, names]) => `<dt>${esc(why)}，${names.length} 个</dt><dd>${names.map(nm).join("、")}</dd>`).join("") + `</dl></details>`;
  }
  html += `</details></section>`;

  /* ---------- 改进建议 ---------- */
  const addons = Object.values(r.addons || {});
  if (advice.length || addons.length || r.guides.length) {
    html += `<section class="block" id="advice" aria-labelledby="adviceT"><header><p class="caption">Advice</p><h2 id="adviceT">改进建议</h2>` +
      (advice.length ? `<p class="sub">按您在第 8 题排的顺序。</p>` : "") + `</header>`;
    if (advice.length) {
      html += `<ol class="advice">` + advice.map((a, i) => `<li><div class="pick-head"><span class="rank">${pad(i + 1)}</span><div class="pick-title"><h3>${esc(a.label)}</h3><span class="help">${esc(a.help)}</span></div></div>` +
        `<div class="pick-body"><p>${esc(a.text)}</p><p class="eg">${a.examples.length ? `<span class="k">推荐里做到的：</span>${a.examples.map(nm).join("、")}` : `<span class="k">推荐里还没有专门做这一点的。</span>`}</p></div></li>`).join("") + `</ol>`;
    }
    for (const ad of addons) {
      html += `<div class="addon"><h4 class="addon-t">${esc(ad.title)}</h4>${ad.why ? `<p>${esc(ad.why)}</p>` : ""}<ul class="rest">` +
        ad.items.map((x) => `<li><a href="${esc(x.repo_url)}" target="_blank" rel="noopener">${nm(x.name)}</a><span class="s">${esc(sentence(x.summary))}</span></li>`).join("") + `</ul></div>`;
    }
    if (r.guides.length) {
      html += `<div class="addon"><h4 class="addon-t">相关的做法和教程</h4><p>没有代码，照着做或参考它的设计。</p><ul class="rest">` +
        r.guides.map((x) => `<li><a href="${esc(x.repo_url)}" target="_blank" rel="noopener">${nm(x.name)}</a><span class="s">${esc(sentence(x.summary))}</span></li>`).join("") + `</ul></div>`;
    }
    html += `</section>`;
  }

  /* ---------- 页脚 ---------- */
  html += `<footer class="foot">` +
    `<div class="actions"><button type="button" class="btn" id="saveAnswers">下载答卷</button><button type="button" class="btn primary" id="saveResults">下载推荐结果</button><a class="btn" href="quiz.html">返回修改问卷</a></div>` +
    `<details class="fold answers"><summary><span class="label caption-zh">查看您的答卷</span><span class="chev">${ARROW}</span></summary><dl id="answers"></dl></details></footer>`;
  sheet.innerHTML = html;

  /* ---------- 答卷 ---------- */
  let ah = "";
  const plain = [];   // 下载用的纯文本答卷
  cfg.parts.forEach((p) => p.questions.forEach((id) => {
    const q = byQ[id];
    const shown = !q.show_if || checkCondition(q.show_if, st.answers);
    if (!shown) return;
    const sel = st.answers[id] || [];
    const txt = sel.map((oid, k) => {
      const o = q.options.find((x) => x.id === oid);
      const free = st.free[`${id}.${oid}`];
      return (q.type === "rank" ? `${k + 1}. ` : "") + (o ? o.label : oid) + (free ? `：${free}` : "");
    }).join(q.type === "rank" ? "　" : "；");
    ah += `<dt><span class="no">第 ${esc(q.number || id.slice(1))} 题</span>${esc(q.text)}</dt><dd>${txt ? esc(txt) : "未回答"}</dd>`;
    plain.push(`第 ${q.number || id.slice(1)} 题　${q.text}`, `　　${txt || "未回答"}`);
  }));
  document.getElementById("answers").innerHTML = ah;

  /* ---------- 下载：答卷、推荐结果各存一份纯文本 ---------- */
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  function saveText(lines, file) {
    const url = URL.createObjectURL(new Blob([lines.join("\r\n") + "\r\n"], { type: "text/plain;charset=utf-8" }));
    const link = Object.assign(document.createElement("a"), { href: url, download: file });
    document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  document.getElementById("saveAnswers").addEventListener("click", () => {
    const day = today();
    saveText(["记忆库推荐 · 答卷", `下载于 ${day}`, "", ...plain], `记忆库推荐答卷-${day}.txt`);
  });
  document.getElementById("saveResults").addEventListener("click", () => {
    const day = today();
    const out = ["记忆库推荐 · 推荐结果", `下载于 ${day}；项目描述基于 README 生成，核实于 2026 年 10 月`, ""];
    if (r.results.length) {
      out.push(`【为您挑出 ${r.results.length} 个记忆库】`);
      r.results.forEach((x, i) => out.push("", `${i + 1}. ${nmPlain(x.name)}`, `　　${sentence(x.summary)}`,
        ...x.reasons.map((t) => `　　· ${t}`), ...(edges[x.id] ? [`　　· ${edges[x.id]}`] : []),
        ...factsOf(x).map(([k, v]) => `　　${k}：${segsOf(v).join("；")}`), `　　${x.repo_url}`));
      if (combos.length) out.push("", "【搭配方案】", ...combos.flatMap((c, i) => [
        `${combos.length > 1 ? PLAN[i] + "：" : ""}${c.parts.map((p) => nmPlain(p.name)).join(" ＋ ")}`, `　　${comboText(c, i)}`]));
      if (r.more?.length) out.push("", `【其余 ${r.more.length} 个也符合条件】`, ...r.more.map((x) => `· ${nmPlain(x.name)}　${x.repo_url}`));
    } else {
      out.push("暂时没有完全符合的。放宽这些条件，就能多出一些选择：", ...r.relax.map((x) => `· ${x.label}：${x.count} 个`));
    }
    if (advice.length) out.push("", "【改进建议】", ...advice.flatMap((a, i) => [`${i + 1}. ${a.label}：${a.text}`, ...(a.examples.length ? [`　　推荐里做到的：${a.examples.map(nmPlain).join("、")}`] : [])]));
    saveText(out, `记忆库推荐结果-${day}.txt`);
  });
</script>
</body>
</html>
