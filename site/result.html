<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>推荐结果 · 记忆库推荐</title>
<script>
  (function () {
    var t = "dark";
    try { t = localStorage.getItem("memsite-theme") || "dark"; } catch (e) {}
    if (t === "dark") document.documentElement.classList.add("theme-dark");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  /* 结果页还在设计中：这里先把答卷逐题列出来，方便核对答题页记录得对不对 */
  .sheet { max-width: 560px; margin: 0 auto; padding: var(--s-6) var(--gutter); }
  h1 { margin: 0; font-family: var(--font-zh); font-weight: 600; font-size: var(--fs-h2); line-height: var(--lh-h2); letter-spacing: var(--ls-zh-title); }
  .lead { margin: var(--s-1) 0 0; color: var(--ink-soft); }
  h2 { margin: var(--s-5) 0 var(--s-1); padding-bottom: var(--s-1); border-bottom: var(--line) solid var(--rule); color: var(--ink-faint); font-weight: 400; }
  dl { margin: 0; }
  dt { margin-top: var(--s-3); font-family: var(--font-zh); color: var(--ink); }
  dt .no { color: var(--ink-faint); margin-right: var(--s-1); }
  dd { margin: var(--s-1) 0 0; color: var(--ink-soft); font-size: var(--fs-small); line-height: var(--lh-small); }
  dd.skip { color: var(--ink-faint); }
  .links { margin-top: var(--s-5); display: flex; gap: var(--s-3); }
  .links a { color: var(--ink-soft); text-underline-offset: 3px; }
</style>
</head>
<body class="paper grain">
<main class="sheet">
  <p class="caption" style="margin:0;color:var(--ink-faint)">Your answers</p>
  <h1>您的答卷</h1>
  <p class="lead caption-zh">结果页正在设计中。下面是这份答卷的全部回答，只保存在您的浏览器里。</p>
  <div id="list"></div>
  <p class="links caption-zh"><a href="quiz.html">回去修改</a><a href="index.html">回到首页</a></p>
</main>
<script type="module">
  import { checkCondition } from "../engine/index.js";
  const cfg = await fetch("../data/questionnaire/questions.json").then((r) => r.json());
  let st = { answers: {}, free: {} };
  try { st = { ...st, ...JSON.parse(localStorage.getItem("memsite-quiz-v2")) }; } catch (e) {}
  const byId = Object.fromEntries(cfg.questions.map((q) => [q.id, q]));
  const list = document.getElementById("list");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  cfg.parts.forEach((p) => {
    let html = `<h2 class="caption-zh">${esc(p.label)}　${esc(p.title)}</h2><dl>`;
    p.questions.forEach((id) => {
      const q = byId[id];
      const shown = !q.show_if || checkCondition(q.show_if, st.answers);
      if (!shown && q.number) return;   // 同一题号的两个版本（如第 8 题），只列显示过的那个
      const sel = st.answers[id] || [];
      const txt = sel.map((oid, k) => {
        const o = q.options.find((x) => x.id === oid);
        const free = st.free[`${id}.${oid}`];
        return (q.type === "rank" ? `${k + 1}. ` : "") + (o ? o.label : oid) + (free ? `：${free}` : "");
      }).join(q.type === "rank" ? "　" : "；");
      html += `<dt><span class="no caption-zh">第 ${esc(q.number || id.slice(1))} 题</span>${esc(q.text)}</dt>`;
      html += shown ? `<dd>${txt ? esc(txt) : "（还没有回答）"}</dd>` : `<dd class="skip">（按前面的回答跳过）</dd>`;
    });
    list.insertAdjacentHTML("beforeend", html + "</dl>");
  });
</script>
</body>
</html>
