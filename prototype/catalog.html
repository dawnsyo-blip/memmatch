<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>完整项目库 · MemMatch</title>
<meta name="description" content="回答 20 道题，找到匹配的 AI 记忆方案">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/sarasa-result-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/sarasa-result-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="thermal.css">
<style>
/* 完整项目库：参与推荐的全部项目，按主要使用方式分组，组内按名字排序。
   每个项目写名字（二级标题）、使用方式标签（辅助）、一句话介绍（正文）和仓库地址（辅助，带外链箭头）。
   和结果页共用字体子集（全部项目数据里的字都在里面） */
@font-face { font-family: "Sarasa Mono SC"; src: url("fonts/sarasa-result-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
@font-face { font-family: "Sarasa Mono SC"; src: url("fonts/sarasa-result-700.woff2") format("woff2"); font-weight: 700; font-display: block; }

.meta { margin-top: var(--lh); }
.meta-lines { margin-top: calc(var(--lh) * .5); }
/* 页头（负责人 2026-11-04 定）：标题居中；返回、下载项目清单、项目收录标准三个反白按钮，和上面的“收录 N 个”同样的小字，居中排成三行 */
.cat .ln { text-align: center; }
.acts-c { margin-top: calc(var(--lh) * .5); text-align: center; }
/* 收录标准和下面两行动作之间：一条单线虚线，上下各空半行 */
.cat-sep { margin-block: calc(var(--lh) * .5); }
/* 两行动作照结果页“自助服务”的格式，用小字：“ 1  动作名 ...... [箭头]”，整行能点，悬停时动作名加下划线 */
.act { display: block; width: 100%; text-align: left; padding-block: calc(var(--lh) * .125); }
.act + .act { margin-top: calc(var(--lh) * .25); }
.act:hover .tx, .act:focus-visible .tx { text-decoration: underline; text-decoration-thickness: .1em; text-underline-offset: .2em; }
.chip { white-space: pre; padding-block: .15em; transition: transform 160ms var(--ease-out); }
.chip:active { transform: scale(0.97); }
@media (prefers-reduced-motion: reduce) { .chip { transition: none; } .chip:active { transform: none; } }
/* 项目收录标准：点开后展开在按钮下面，格式照结果页的默认推荐偏好 */
.std-body { padding: calc(var(--lh) * .5) 0 calc(var(--lh) * .25); }
.std-body a { text-decoration: underline; text-underline-offset: .2em; }
.meta + .sec { margin-top: var(--lh); }
/* 项目之间空一行；名字和标签紧挨着，介绍和它们隔 0.25 行 */
/* 项目之间隔一条单线虚线（负责人 2026-11-04 要求），上下的空由 .sep 给 */
.item .intro { margin-top: calc(var(--lh) * .25); }
/* 名字后面的作者、旧名不加粗 */
.item .note { font-weight: 400; font-size: var(--fs-s); }
footer .bar { margin-top: calc(var(--lh) * .5); }
</style>
</head>
<body>

<div class="dock" aria-hidden="true">
  <div class="plate"><span class="clip l"></span><span class="bezel"></span><span class="slit"></span><span class="clip r"></span></div>
</div>
<div class="lip" aria-hidden="true"><i></i></div>
<div class="dock-low" aria-hidden="true">
  <div class="plate"><span class="clip l"></span><span class="bezel"></span><span class="slit"></span><span class="clip r"></span></div>
</div>

<main class="wrap">
  <div class="shadow" aria-hidden="true"></div>
  <div class="paper">
    <div class="inner">
      <div class="topbars" id="topbars" aria-hidden="true"></div>
      <div id="sheet"><p class="p">正在读取……</p></div>
    </div>
  </div>
</main>

<script type="module">
import { splitName } from "../site/assets/result-text.js";
import {
  W_S, FONTS, cols, esc, rule, center, L, faint, barcode, stamp,
  OUT, P, S, section, sep, formTagsOf, tagsText, titleHTML, hang, dotsRow, tapToTop,
} from "./thermal.js";

const sheet = document.getElementById("sheet");
document.getElementById("topbars").innerHTML = barcode(20261103, 46);

const json = (path) => fetch(new URL(path, import.meta.url)).then((r) => {
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
});
let data, usage;
try {
  [data, usage] = await Promise.all([json("../site/data/projects.json"), json("../data/usage_form.json").catch(() => ({}))]);
} catch (e) {
  sheet.innerHTML = `<p class="p">读不到项目数据。请在项目目录运行 npm run site，再打开 http://localhost:5173/prototype/catalog.html</p>`;
  throw e;
}
await FONTS;
const labels = usage._labels || {};

// 一句话介绍：简介的第一句
const oneLine = (s) => { const t = String(s ?? "").trim(); const k = t.indexOf("。"); return k < 0 ? t : t.slice(0, k + 1); };
// 仓库地址：去掉 https:// 和末尾的斜杠；做法类条目链接到说明文档，写“查看做法说明”
const repoText = (u) => String(u ?? "").replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");

const noteText = (n) => (/[\u4e00-\u9fff]/.test(n) ? n : `作者 ${n}`);
function item(p) {
  const [name, note] = splitName(p.name);
  const isMethod = [].concat(p.normalized?.project_role?.value || []).includes("method");
  // 名字后面括号里的是作者或说明，用辅助字号，免得看成名字的一部分；纯英文的是作者名，写成“作者 xxx”
  return `<article class="item">${P(`${esc(name)}${note ? ` <span class="note">${esc(noteText(note))}</span>` : ""}`, "p h")}` +
    S(tagsText(formTagsOf(p, labels))) +
    (p.info?.summary?.value ? P(esc(oneLine(p.info.summary.value)), "p intro") : "") +
    (p.repo_url ? P(`<a class="repo" href="${esc(p.repo_url)}" target="_blank" rel="noopener"><span class="link">${esc(isMethod ? "查看自主管理说明" : repoText(p.repo_url))}</span> ${OUT}</a>`, "p small intro") : "") +
    `</article>`;
}

// 按主要使用方式（usage_form 的第一个）分组。组的顺序负责人 2026-11-03 定；转发服务没排进去，跟在独立服务后面
const ORDER = ["plugin_agent", "plugin_chat", "service", "proxy", "chat_app", "app", "bot", "cli", "library", "guide", "method", "model"];
const groups = new Map([...ORDER, ...Object.keys(labels).filter((k) => !ORDER.includes(k))].map((k) => [k, []]));
const other = [];
for (const p of data.projects) {
  const f = [].concat(p.normalized?.usage_form?.value || [])[0];
  (groups.get(f) || other).push(p);
}
// 组内按 Star 数从多到少（负责人 2026-11-03 定）；Star 数相同按名字：英文在前、不分大小写，中文按拼音；
// 没有 Star 数的（自主管理的两条做法）排在最后。名字开头的符号（如 /memory）不参与排序
const zh = new Intl.Collator("zh-Hans-CN-u-co-pinyin", { sensitivity: "base" }), en = new Intl.Collator("en", { sensitivity: "base" });
const bare = (p) => splitName(p.name)[0].replace(/^[^\p{L}\p{N}]+/u, "");
function byName(a, b) {
  const d = (b.stars ?? -1) - (a.stars ?? -1);
  if (d) return d;
  const x = bare(a), y = bare(b), ax = /^[A-Za-z0-9]/.test(x), ay = /^[A-Za-z0-9]/.test(y);
  return ax !== ay ? (ax ? -1 : 1) : ax ? en.compare(x, y) : zh.compare(x, y);
}

// 从首页进来（?from=home）只给“返回首页”，从结果页进来给“返回推荐结果”（负责人 2026-11-03 定）
const BACK = new URLSearchParams(location.search).get("from") === "home"
  ? { href: "receipt.html", text: "返回首页" } : { href: "result.html", text: "返回推荐结果" };
const now = stamp();
// 项目收录标准：照 docs/前端/项目收录标准.md（负责人 2026-11-04 写），改了 md 要同步这里
const A = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${esc(text)}</a>`;
const STANDARDS = [
  `在一些 conversational memory benchmark 上评分较高的项目。涉及的 benchmark 包括 LongMemEval、LoCoMo、PersonaMem、MemBench、BEAM 等。`,
  `被收录到 ${A("https://github.com/DasterProkio/awesome-ai-companion", "awesome-ai-companion")} 和 ${A("https://www.ailover-atlas.com/", "AI Companion Atlas")} 中的记忆类、上下文工程类项目（感谢 ${A("https://github.com/DasterProkio", "@DasterProkio")} 老师和 ${A("https://github.com/See-Sol-Lab", "@See-Sol-Lab")} 老师）。仅获取事实信息，内容经过改编，分类字段、简介都已重写。`,
  `相关论文中提及并且已落地的记忆框架产品。`,
  `个人冲浪时观察到的在中文/英文社区讨论度比较高的项目。`,
];
const stdHTML = () => `<div class="std-body small stack" id="stdBody" hidden>` +
  STANDARDS.map((t, i) => hang(4, `${`${i + 1}.`.padEnd(4)}${t}`)).join("") + `</div>`;
// 一行动作：和结果页“自助服务”同一格式，用小字
function act(n, label, arrow, attrs) {
  const tag = attrs.startsWith("href") ? "a" : "button";
  const line = dotsRow(` ${n}`.padEnd(4) + label, `<span class="inv"> ${arrow} </span>`, W_S, cols(arrow) + 2)
    .replace(label, `<span class="tx">${esc(label)}</span>`);
  return `<${tag} class="act" ${attrs}><span class="l small">${line}</span></${tag}>`;
}
let html = `<div class="cat">${titleHTML(["完整项目库"])}</div>`;
html += `<div class="meta">${L(rule("=", W_S), "small")}<div class="meta-lines">` +
  L(center(`收录 ${data.projects.length} 个记忆类项目`, W_S), "small") + L(center("2026-10-30", W_S), "small")  /* 收录名单定下来的日期，固定写（负责人 2026-11-04 定） */ + `</div>` +
  // 时间下面是项目收录标准（点开展开），一条单线虚线，再是返回和下载两行动作（负责人 2026-11-04 定）
  `<div class="acts-c small"><button type="button" class="chip inv" id="stdBtn" aria-expanded="false" aria-controls="stdBody"> <span class="u">项目收录标准</span> </button></div>` +
  stdHTML() + `<div class="cat-sep">${L(rule("-", W_S), "small")}</div>` +
  act(1, BACK.text, "→", `href="${BACK.href}"`) + act(2, "下载项目清单", "↓", 'type="button" id="listBtn"') + `</div>`;
for (const [f, list] of groups) if (list.length) html += section(labels[f], list.sort(byName).map(item).join(sep()));
if (other.length) html += section("其它", other.sort(byName).map(item).join(sep()));

// 不单独做关于页（负责人 2026-11-04 定）：信息来源和核实情况写在页尾，和结果页页脚同样三行
html += `<footer class="sec">${L(rule("=", W_S), "small")}<a class="bar half" href="${BACK.href}">${BACK.text}</a>` +
  `${L(rule("=", W_S), "small")}<div class="half">` +
  ["项目信息据 README 整理", "未经实际安装验证", "核实于 2026 年 10 月"].map((t) => L(center(t, W_S), "small")).join("") + `</div></footer>`;
sheet.innerHTML = html;
faint(sheet, ".l, .p");
tapToTop();

const stdBtn = document.getElementById("stdBtn"), stdBody = document.getElementById("stdBody");
stdBtn.addEventListener("click", () => {
  stdBody.hidden = !stdBody.hidden;
  stdBtn.setAttribute("aria-expanded", String(!stdBody.hidden));
});
// 下载项目清单：每个项目一行，名字和地址，按页面上的分组和顺序（负责人 2026-11-04 定）
document.getElementById("listBtn").addEventListener("click", () => {
  const all = [...groups.values(), other].flat();
  const lines = ["MemMatch 收录的记忆类项目", `共 ${all.length} 个，下载于 ${now.date}`, "", ...all.map((p) => `${splitName(p.name)[0]}  ${p.repo_url}`)];
  const url = URL.createObjectURL(new Blob([lines.join("\r\n") + "\r\n"], { type: "text/plain;charset=utf-8" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: `MemMatch项目清单-${now.date}.txt` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body>
</html>
