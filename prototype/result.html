<style>
/* 完整结果页：和 receipt.html 同一套出票口、纸和 32 格网格。
   结构沿用旧版 site/result.html（2026-10-28 定）：概况和默认推荐偏好 → 推荐 → 搭配方案 → 排除原因 → 强化补丁（原“改进建议”）→ 页脚；每个部分都能展开收起。
   字体子集包含全部项目数据里的字，比答题页的大，由 scripts/subset_receipt_font.py 一起生成 */
@font-face { font-family: "Sarasa Mono SC"; src: url("fonts/sarasa-result-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
@font-face { font-family: "Sarasa Mono SC"; src: url("fonts/sarasa-result-700.woff2") format("woff2"); font-weight: 700; font-display: block; }

/* 纵向节奏都是正文行高 --lh 的倍数（据项目的中文排版规范：标题离下文比离上文近）：
   部分之间 1.5 行；部分标题到内容半行；卡片之间是细分隔线，上下各 0.75 行；
   卡片里的几组（简介、理由、细节、链接）之间半行；同一组的条目之间 0.25 行，一条折行时不留空 */
/* 小节：二级标题到它的条目 0.25 行，比小节之间的半行近 */
.grp > * + * { margin-top: calc(var(--lh) * .25); }
/* 门槛、花销、注意这类细节：分号分出的每一句之间留一点空（比折行宽，看得出是另一句），不同项之间空半行 */
.fact > * + * { margin-top: calc(var(--lh-s) * .2); }
.list > .fact + .fact { margin-top: calc(var(--lh) * .5); }
/* 正文缩进标题字号的 3 格，和“01 ”后面的项目名对齐 */
.body { padding-left: calc(var(--fs-h) * 1.5); }
.in2 { padding-left: var(--fs); }
/* 推荐项目和搭配方案的正文：简介（主句）和前后的标签、细节之间空一行，比细节各项之间的半行大 */
.cbody { margin-top: var(--lh); }
.cbody > * + * { margin-top: var(--lh); }
/* 页眉：标题下空一行；分隔线到编号、编号日期到按钮各空半行；页眉到第一个部分空一行（比部分之间的 1.5 行近，页眉和内容是一体的） */
.meta { margin-top: var(--lh); }
.meta-act { margin-top: calc(var(--lh) * .5); }
.meta-lines { margin-top: calc(var(--lh) * .25); }
.meta + .sec, .meta-note { margin-top: var(--lh); }
/* 页头（负责人 2026-11-04 给的示意图）：大标题和下面四行都居中 */
.shop .ln { text-align: center; }
.meta-c { text-align: center; }
.meta-c > * + * { margin-top: calc(var(--lh-s) * .25); }
/* 订购人：一条下划线，点进去就能填，只存在访客自己的浏览器里 */
.buyer { width: 12ch; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; text-align: center; padding: 0; line-height: inherit; }
.buyer:focus { outline: none; border-bottom-width: 2px; }
#prefBtn { padding-block: .15em; }
.pref-body { padding: calc(var(--lh) * .5) 0 calc(var(--lh) * .25); }
/* 页脚：分隔线之间的每一块上下各留半行；“自助服务”的每一行是按钮，整行可点，悬停时动作名加下划线 */
.foot-blk { padding-block: calc(var(--lh) * .5); }
/* 和首页菜单一样：每行上下 0.125 行，行与行之间再空 0.25 行，反白的箭头不会贴在一起 */
.act { display: block; width: 100%; text-align: left; padding-block: calc(var(--lh) * .125); }
.act + .act { margin-top: calc(var(--lh) * .25); }
/* 排除原因每条下面的“去第 N 题修改”：靠右，紧贴上一行 */
.edit { text-align: right; }
/* 排除原因的条目之间空 0.75 行，比折行明显，看得出是另一条（负责人 2026-11-04 要求加大） */
.grp .list > * + * { margin-top: calc(var(--lh) * .75); }
/* 小标题上方的空要比条目之间大，看得出是新的一块 */
.grp + .grp { margin-top: calc(var(--lh) * 1.5); }
.act:hover .tx, .act:focus-visible .tx { text-decoration: underline; text-decoration-thickness: .1em; text-underline-offset: .2em; }
.chip { white-space: pre; transition: transform 160ms var(--ease-out); }
.chip:active { transform: scale(0.97); }
@media (prefers-reduced-motion: reduce) { .chip { transition: none; } .chip:active { transform: none; } }
</style>

<script type="module">
import { checkCondition } from "../engine/index.js";
import { edgeLines, adviceItems, splitName } from "../site/assets/result-text.js";
import { run } from "./sample.js";
import {
  W, W_H, W_S, FONTS, cols, esc, sp, rule, center, spread, wrapCols, L, pairHTML, faint,
  barcode, codeOf, fnv, stamp, serialNo, titleHTML, titledRule, dotsRow, dotsPairHTML, numOf, rowLabel, answerText, pad2,
  OUT, P, S, hang, TOG, foldLine, section, sep, formTagsOf, tagsText,
} from "./thermal.js";

const sheet = document.getElementById("sheet");
document.getElementById("topbars").innerHTML = barcode(20261102, 46);

let ctx;
try {
  ctx = await run();
} catch (e) {
  sheet.innerHTML = `<p class="p">读不到项目数据。请在项目目录运行 npm run site，再打开 http://localhost:5173/prototype/result.html</p>`;
  throw e;
}
// 还没答过题：转回首页去答题（不再显示示例答卷）
if (ctx.empty) { location.replace("receipt.html"); await new Promise(() => {}); }
await FONTS;
const { cfg, data, usage, st, answers, byQ, r, sample, demo } = ctx;
const byId = Object.fromEntries(data.projects.map((p) => [p.id, p]));
const edges = edgeLines(r.results, byId);
const advice = adviceItems(answers, cfg, r.results, byId);
const val = (id, f) => byId[id]?.normalized?.[f]?.value;

// 名字：括号里的作者、旧名拆出来，名字加粗、备注不加粗
const nm = (n) => { const [a, b] = splitName(n); return `<b>${esc(a)}</b>` + (b ? ` ${esc(b)}` : ""); };
const nmPlain = (n) => { const [a, b] = splitName(n); return b ? `${a} · ${b}` : a; };
const sentence = (s) => { s = String(s ?? "").trim(); return !s || /[。！？]$/.test(s) ? s : s + "。"; };
const repoText = (u) => String(u ?? "").replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
// 汉字和英文、数字之间补一个空格，再转义
const mixSpace = (s) => esc(String(s).replace(/([\u4e00-\u9fff])([A-Za-z0-9])/g, "$1 $2").replace(/([A-Za-z0-9])([\u4e00-\u9fff])/g, "$1 $2"));


/* ---------- 搭配方案的说明句 ---------- */
// 写法（负责人 2026-11-04 定，规则全文见 docs/前端/结果页LLM提示词.md 的“搭配方案说明的写法”）：
// 正文最多三句：怎么搭；和另一个方案相比好在哪；少管了哪件事。不用冒号、括号、破折号，用平常的说法
const STAGE = { capture: "记下", consolidate: "整理", retrieve: "想起", forget: "淡忘", review: "查看修改" };
const gist = (id) => String(byId[id]?.info?.summary?.value || "").split(/[：；，。]/)[0];
const stageList = (arr) => arr.map((s) => STAGE[s]).join("、");
const N = (p) => splitName(p.name)[0];
const ROLE_DO = { context_tool: "让长对话不断线", state_engine: "给 AI 加上会变化的情绪或身体状态" };
const ROLE_GAP = { context_tool: "长对话聊久了还是会丢前文", state_engine: "AI 的情绪和状态不会随时间变化" };
const roleOf = (p) => [].concat(val(p.id, "project_role") || [])[0];
const roleDo = (p) => ROLE_DO[[].concat(val(p.id, "project_role") || [])[0]] || gist(p.id);
const fitsOthers = (p) => [].concat(val(p.id, "pairing") || []).some((v) => v === "standard_interface" || v === "designed_to_pair");
function comboNames(c) {
  const cur = c.parts.filter((p) => p.current), add = c.parts.filter((p) => !p.current);
  const curHtml = cur.length ? cur.map((p) => (p.id ? nm(p.name) : `<b>${esc(p.name)}</b>`)).join("、") + (cur[0].id ? ` <span class="u">您在用</span>` : "") : "";
  return [curHtml, ...add.map((p) => nm(p.name))].filter(Boolean).join(" + ");
}
// 在现有记忆上补的方案里，现有的那份记忆叫什么
const nativeName = (c) => c.parts.find((p) => p.current && !p.id)?.name || "客户端自带的记忆";
const nativeSay = (c) => (nativeName(c) === "客户端自带的记忆" ? "客户端自带的记忆" : nativeName(c));
// 第一句：这个方案怎么搭
function comboBody(c) {
  const parts = c.parts, last = parts[parts.length - 1], B = N(last);
  const base = parts.filter((p) => p.current).map(N).join("、");
  if (c.type === "current" && c.base === "notes")
    return `保留您的笔记库，再加上 ${B}` + (c.via === "markdown" ? `。${B} 把记忆存成 Markdown 文件，可以和笔记放在一起` : "");
  if (c.type === "current" && c.base === "native")
    return `继续用${nativeSay(c)}，再接上 ${B}` + (c.via === "concern" ? `。${B} 专门针对您在第 7 题选的“${c.label}”` : "");
  if (c.type === "current")
    return c.via === "addon" ? `在您正在用的 ${base} 上再加 ${B}，${B} ${roleDo(last)}` : `您正在用的 ${base} 再配上作者为它设计的 ${B}`;
  if (c.type === "complete")
    return `${N(parts[0])} 一个项目就能管好记下、整理、想起、淡忘和查看修改` +
      (c.via === "addon" ? `，再加上 ${B}，${B} ${roleDo(last)}` : `，再配上作者为它设计的 ${B}`);
  if (c.via === "pairs") return parts.map((p) => `${N(p)} ${gist(p.id)}`).join("，");
  return `${N(parts[0])} 负责记忆，` + parts.slice(1).map((p) => `${N(p)} ${roleDo(p)}`).join("，");
}
// “注意”里的补充：为什么合起来比单独用好
function comboWhy(c) {
  const real = c.parts.filter((p) => p.id), last = real[real.length - 1];
  const has = (id, f, v) => [].concat(val(id, f) || []).includes(v);
  if (c.base === "notes") return `笔记库要靠您自己动手记，${N(last)} ${last.stages.includes("capture") ? "能自动记下，需要时自动想起" : "能帮您管理记忆"}`;
  if (c.base === "native") {
    if (has(last.id, "cross_client", "yes")) return `${nativeSay(c)}只在这一个工具里有效，${N(last)} 的记忆可以在几个工具之间共用`;
    if (["dashboard", "files"].some((v) => has(last.id, "human_review", v))) return `${nativeSay(c)}不方便查看和修改，${N(last)} 的记忆可以随时打开查看和修改`;
    return "";
  }
  const A = real[0];
  if (c.via === "pairs") {
    if (c.type === "group") return "几个项目的分工是作者定好的，只用其中一个只能顾到一部分";
    // 完整系统的第一句已经说了“一个项目就能管好”，这里不再说“只用它也可以”
    if (c.type === "complete") return `${N(last)} ${gist(last.id)}`;
    return `只用 ${N(A)} 也可以，加上 ${N(last)} 以后，${gist(last.id)}`;
  }
  const gaps = real.map((p) => ROLE_GAP[roleOf(p)]).filter(Boolean);
  return gaps.length ? `只用 ${N(A)} 时，${gaps.join("，")}` : "";
}
// “注意”里的补充：几个部件配合得怎么样
function comboFit(c) {
  const real = c.parts.filter((p) => p.id), last = real[real.length - 1];
  if (c.base === "native") return `${nativeSay(c)}和 ${N(last)} 各记各的，不会互通，建议以 ${N(last)} 为准`;
  if (c.base === "notes") return c.via === "markdown" ? `${N(last)} 的记忆文件可以放进笔记库，在笔记软件里直接查看和修改` : `${N(last)} 不把记忆存进笔记库，两边各管各的`;
  if (c.via === "pairs") return "作者在说明里写了它们怎么一起用";
  const odd = real.filter((p) => !p.current && !fitsOthers(p));
  if (odd.length) return `${odd.map(N).join("、")} 的说明里没写能不能和别的项目一起用，要自己试一下`;
  return `${real.length > 2 ? "几个" : "两个"}项目分工不同，不会争着改同一份记忆，可以同时用`;
}
// 说明句里提到另一个方案时的叫法，和标题的编号 01、02 对应
const PLAN = ["方案 01", "方案 02"];
const DIFF = { low: 0, medium: 1, high: 2 };
const stagesIn = (c) => Object.keys(STAGE).filter((s) => c.parts.some((p) => p.stages.includes(s)));
function comboFacts(c) {
  const adds = c.parts.filter((p) => p.id && !p.current);
  return {
    keep: c.type === "current",
    installs: adds.length,
    stages: stagesIn(c),
    paired: c.via === "pairs",
    diff: Math.max(...adds.map((p) => DIFF[val(p.id, "difficulty")] ?? 1)),
    free: adds.every((p) => [].concat(val(p.id, "spend") || []).includes("none")),
  };
}
// 这个方案胜过另一个方案的地方，按重要程度排；装几个项目、门槛和花销变化大，排在最后
function comboEdge(c, other) {
  const x = comboFacts(c), y = comboFacts(other), out = [];
  if (x.keep && !y.keep) out.push("不用换掉您现在用的记忆");
  if (!x.keep && y.keep) out.push("从头搭一套新的，不受现在用的记忆限制");
  if (x.paired && !y.paired) out.push("作者本来就是让它们一起用的");
  const more = x.stages.filter((s) => !y.stages.includes(s));
  if (x.stages.length === 5 && y.stages.length < 5) out.push("记下、整理、想起、淡忘、查看修改都能管");
  else if (more.length) out.push(`还能${stageList(more)}`);
  if (x.installs < y.installs) out.push(`只需要装 ${x.installs} 个项目`);
  if (x.diff < y.diff) out.push("装起来更简单");
  if (x.free && !y.free) out.push("不用额外花钱");
  if (!out.length && x.installs > y.installs) out.push("分工更细，每个项目只管一件事");
  return out;
}
const combos = r.combos.length === 2 && comboEdge(r.combos[0], r.combos[1]).length && comboEdge(r.combos[1], r.combos[0]).length
  ? r.combos : r.combos.slice(0, 1);
// 汉字和英文、数字之间补一个空格，两个汉字之间不留空格（拼句子时名字两边的空格不一定对）
const tidy = (t) => t.replace(/([一-鿿])\s+(?=[一-鿿])/g, "$1")
  .replace(/([一-鿿])([A-Za-z0-9])/g, "$1 $2").replace(/([A-Za-z0-9])([一-鿿])/g, "$1 $2");
// 几条优势连在一起时，最后一条前面加“而且”
const joinEdge = (a) => (a.length > 1 ? a.slice(0, -1).join("，") + "，而且" + a[a.length - 1] : a[0]);
function comboLead(c, i) {
  const other = combos[1 - i];
  const body = tidy(comboBody(c) + "。");
  if (!other) return body;
  // 在现有记忆上补的方案，第一句已经说了“继续用”，比较时不再说“不用换掉”
  const edge = comboEdge(c, other).filter((e) => !(e.startsWith("不用换掉") && c.type === "current"));
  const lack = comboFacts(other).stages.filter((s) => !comboFacts(c).stages.includes(s));
  return body + tidy((edge.length ? `和${PLAN[1 - i]}相比，这个方案${joinEdge(edge)}。` : "") +
    (lack.length ? `不过它不管${stageList(lack)}，这一点不如${PLAN[1 - i]}。` : ""));
}
// 第一段已经说了“作者本来就是让它们一起用的”，“注意”里不再重复
const comboMore = (c, i) => {
  const lead = comboLead(c, i);
  const hostMem = [...new Set(c.parts.filter((p) => p.id && !p.current).flatMap((p) => (p.host_memory || []).map((t) => `${N(p)} ${t}`)))];
  return [comboWhy(c), comboFit(c), ...hostMem].filter(Boolean)
    .filter((t) => !(t.startsWith("作者在说明里") && lead.includes("作者本来就是让它们一起用的")))
    .map((t) => tidy(t + "。"));
};
// 每个部件在用户的工具里怎么接（引擎按挂载位置算出，部件都接在同一个工具上）
const comboHow = (c) => c.parts.filter((p) => p.id && p.how).map((p) => `${N(p)}，${p.how}`);
const comboText = (c, i) => comboLead(c, i) + comboMore(c, i).join("");

/* ---------- 一张卡片 ---------- */
// 门槛、花销、需要、注意不用句号：句号和分号处都换行（负责人 2026-11-03 定），换行前用“；”，最后一句不加标点
const segsOf = (texts) => [].concat(texts).flatMap((t) => String(t ?? "").split(/[。；;]/))
  .map((s) => s.trim().replace(/[。；，]+$/, "")).filter(Boolean);
// 比较两段话是不是在说同一件事：看共有的英文词（4 个字母以上）
const latinWords = (t) => new Set((String(t ?? "").match(/[A-Za-z]{4,}/g) || []).map((w) => w.toLowerCase()));
// 设备（负责人 2026-11-03 要）：运行在哪里（runs_on）、支持的系统（os）、只用手机能否装好（setup_device），各一句
const RUNS_ON = { own_computer: "自己的电脑", own_server: "自己的服务器", own_cloud_account: "自己的云平台账号", third_party_hosted: "项目方的服务器", phone: "手机" };
const OS = { windows: "Windows", macos: "macOS", linux: "Linux", android: "安卓", ios: "iOS" };
const SETUP = { needs_computer: "安装要用电脑", phone_ok: "只用手机就能装好" };
function deviceText(x) {
  const v = (f) => [].concat(val(x.id, f) || []);
  // 按上面表里的顺序写（电脑在前），不按数据里的字母顺序
  const runs = Object.keys(RUNS_ON).filter((k) => v("runs_on").includes(k)).map((k) => RUNS_ON[k]);
  const os = v("os").includes("any") ? ["不限系统"] : Object.keys(OS).filter((k) => v("os").includes(k)).map((k) => OS[k]);
  const setup = v("setup_device").map((k) => SETUP[k]).filter(Boolean);
  return [runs.length ? `运行在${runs.join("、")}` : "", os.length ? `支持 ${os.join("、")}` : "", ...setup].filter(Boolean);
}
const NOT_ACCOUNT = new Set(["none", "model_api_key", "claude_subscription"]);
function factsOf(x) {
  const diff = [], warn = [];
  for (const c of x.cautions) {
    if (c.startsWith("上手门槛：")) diff.push(c.slice(5));
    else if (c.startsWith("需要：")) continue;
    else warn.push(c);
  }
  if (x.unknowns.length) warn.push(`说明里没写清，需自行确认：${x.unknowns.join("、")}`);
  const safety = byId[x.id]?.safety_note;
  if (safety) warn.push(safety);
  const sameAsSummary = (t) => { const ref = latinWords(x.summary); return [...latinWords(t)].filter((w) => ref.has(w)).length >= 2; };
  for (let k = warn.length - 1; k >= 0; k--) if (sameAsSummary(warn[k])) warn.splice(k, 1);
  const spend = String(val(x.id, "spend_note") || "").replace(/^需要一些额外花销来搭配这个项目：/, "");

const SAME = [
  [/情绪/, /情绪/],
  [/原话/, /原话|原文/],
  [/普通文件|Markdown/, /文件|Markdown/],
  [/面板/, /面板/],
  [/打重要性分/, /打分|重要性/],
  // 简介里只说“存放 AI 的身份”不算，要说到换窗、换模型才算（负责人 2026-11-03 定）
  [/换窗|换模型|同一个 TA/, /换窗|换模型|不同模型/],
  [/几个入口共用|共用一份/, /共用|几个入口|不同聊天软件/],
  [/分开记忆/, /分开/],
  [/不想再提/, /不想再提|拒绝过/],
  [/新窗口/, /新对话|新窗口|换对话窗口/],
  [/淡忘|遗忘/, /淡化|忘|归档/],
  [/不调用大模型/, /不调用大模型|不用大模型/],
  [/分层/, /分层|三级|一级级/],
];
const saidIn = (t, sum) => SAME.some(([a, b]) => a.test(t) && b.test(sum));
function prosOf(x) {
  const sum = String(x.summary || ""), out = [], e = edges[x.id];
  if (e) {
    const k = e.indexOf("：");
    const items = e.slice(k + 1).split("；").filter((t) => !saidIn(t, sum));
    if (items.length) out.push(e.slice(0, k + 1) + items.join("；"));
  }
  for (const t of x.reasons) if (!saidIn(t, sum)) out.push(t);
  return out;
}

      ...factsOf(x).map(([k, v]) => `　　${k}：${segsOf(v).join("；")}`), `　　${x.repo_url}`));
    if (combos.length) out.push("", "【搭配方案】", ...combos.flatMap((c, i) => [
      `${combos.length > 1 ? PLAN[i] + "：" : ""}${c.parts.map((p) => nmPlain(p.name)).join(" ＋ ")}`, `　　${comboText(c, i)}`,
      ...(comboHow(c).length ? [`　　接法：${comboHow(c).join("；")}`] : [])]));
  } else {
    out.push("暂时没有完全符合的。放宽这些条件，就能多出一些选择：", ...r.relax.map((x) => `· ${x.label}：${x.count} 个`));
  }
  if (advice.length) out.push("", "【改进建议】", ...advice.flatMap((a, i) => [`${i + 1}. ${a.label}：${a.text}`, ...(a.examples.length ? [`　　推荐项目中的相关项目：${a.examples.map(nmPlain).join("、")}`] : [])]));
  saveText(out, `记忆库推荐结果-${now.date}.txt`);
});
</script>
