<script defer src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script type="module">
/* ================= 可调参数 ================= */
const PHI = (1 + Math.sqrt(5)) / 2; // 黄金比例 φ ≈ 1.618，沙漏的比例和在屏幕上的位置都按它来定
const CONFIG = {
  // 句子从 sentencesUrl 读取（每句的 keywords 能通过瓶颈）；读不到时（比如直接双击打开文件）用下面这份备用。
  // 备用句子里方括号标出能通过的词，显示时不带方括号
  sentencesUrl: "../hourglass-sentences.json",
  sentences: [
    "I've [seen] things you wouldn't believe",
    "I watched [C-beams] [glitter] in the dark",
    "like [tears] in [rain]",
    "I want more [life]",
    "meet me in [Montauk]",
    "I loved you on this [day]",
    "I love this [memory]",
    "you can [erase] someone from your [mind]",
    "we all need [mirrors] to know who we are",
    "when my [eyes] are closed",
    "the [world] is still there",
    "I looked into his [eyes] and saw [recognition]",
    "I used to think this was your [story]",
    "[memory] doesn't work like I thought",
    "we are so bound by [time]",
    "each time you hear a sad [guitar]",
    "the [memories] I value most don't [fade]",
    "I could recall every [leaf] on every [tree]",
    "I keep [dreaming] of a [house] by the [sea]",
    "your [voice] was the last thing I [lost]",
  ],

  flowSpeed: 0.3,            // 带子被抽进瓶颈的速度：每秒走过沙漏高度的几分之一
  eatLine: 0.04,             // 被过滤的词在瓶颈口往下多深处被逐个字母吃掉（÷ 沙漏高度）；放低一点，被吃的字母不会和上面的词堆混在一起
  turnRate: 3,               // 弧度/秒，被拖向瓶颈的那一节最快转多快；越小转得越缓
  minUpperWords: 54,         // 上半部分低于这个数就补下一句
  maxLowerWords: 12,         // 下半部分最多保留几个清楚的词
  initialLowerCount: 12,     // 页面打开时下半部分预置几个清楚的词
  initialLowerWords: ["tears", "rain", "mirrors", "Montauk", "glitter", "life"], // 预置词，不够时接着用句子里的关键词

  sentenceHold: 1.2,         // 秒，新句子完整显示多久后松开
  wordReleaseStagger: 0.08,  // 秒，从第一个词开始逐个松开的间隔

  fade: {
    lowerOverflow: 3,        // 秒，下半部分超出上限时最旧的词褪成痕迹
  },

  // 下半部分的旧词褪成很淡的痕迹留在原处，新词压在上面，慢慢把下半部分的轮廓撑出来
  trace: {
    alpha: 0.16,             // 痕迹的不透明度
    max: 16,                 // 最多保留多少个痕迹，超过时最老的淡掉
    initial: 10,             // 页面打开时预置多少个痕迹
    retire: 2.5,             // 秒，最老的痕迹淡掉所用的时间
    clearance: 0.08,         // 痕迹堆到离通道出口这么近（÷ 沙漏高度）时，最老的痕迹先淡掉
  },

  // 上半部分怎么往瓶颈流
  flow: {
    order: "nearest",        // "nearest"：谁离瓶颈最近先吃谁，一个词吃完再挑下一个，像沙子一样从底下漏；
                             // "sentence"：一句一句吃（从离瓶颈最近的词开始，先往左到句首、再往右到句尾），要把句子从词堆里拽出来，词堆容易被顶得弹起来。
                             // 模拟里 nearest 往上弹的词少一半多，大幅弹起少八成
    upperAir: 0.06,          // 上半部分的空气阻力：越大落得越慢、越不弹。0.012 会弹；0.06 时最快约每秒 310px，像沙子缓缓落下；0.08 更稳但像慢动作
    sideDrop: true,          // 新句子一句靠左、一句靠右落下，贴着杯壁补进来（见 layoutItems）
    // 真实沙漏的表面是凹的：出口正上方那一柱沙子沉得最快，四周的沙子顺着坡滑进去。
    // 这里让瓶颈正上方一柱里的词摩擦小、多受一点向下的力；两侧的词摩擦大，慢慢滑进坑里
    funnel: {
      width: 0.35,           // 中间一柱的半宽 ÷ 该高度上沙漏内壁的半宽
      push: 0.5,             // 中间一柱里的词额外受到的向下的力 ÷ 重力
      friction: 0.02,        // 中间一柱里的词的摩擦
      sideFriction: 0.8,     // 两侧的词的摩擦：大一些，坡才立得住，坑才凹得下去
    },
  },

  // 一句话是一条软带子；每个词再切成几节，长词也能弯
  ribbon: {
    gap: 0.38,               // 词与词的间距 ÷ 最大字号（也是句子显示时的词距）
    segChars: 3,             // 每节大约几个字母；不超过 segChars + 1 个字母的词不切。越小切得越细、越能弯，但物体越多
    softness: 0.03,          // 词弯了以后弹回去的力，越小越软（约 0.02～0.2）；太小词会折成几截、读不出来
    stiffness: 0.3,          // 词与词之间的带子拉紧时的硬度
    holdTime: 3,             // 秒，句子落下后带子保持拉紧多久；之后放松，静静堆着的词才不会互相拉扯发抖
    reel: 0,                 // 带子拉紧后每秒收短多少（÷ 沙漏高度）；0 表示保持拉紧那一刻的长度，收短会把整句往一起拽，被吃之前弹一下
  },

  // 关键词竖着离开通道，带一点随机转动；每个词随机有一节更重，落地时往哪边倒各不相同
  exitSpin: 0.025,           // 出通道时的最大角速度（弧度/帧）
  heavyRange: [1.5, 3],      // 较重那一节是普通的几倍重

  colors: {
    background: "#F4F3EF",
    text: "#111111",
  },

  font: {
    family: '"Cormorant Garamond", Georgia, serif',
    weights: [300, 400, 500, 600], // 每个词随机取一种字重，堆起来有颗粒感
    // 字号范围：沙漏高 800px 时的像素值，随沙漏大小等比缩放
    sizeMin: 16,
    sizeMax: 25,
  },

  // 以下比例都是相对整个沙漏的高度
  hourglass: {
    // 版面按黄金比例：
    //   沙漏总高 = 屏幕高 ÷ φ（宽度不够时按宽度缩小）；
    //   上方留白 : 下方留白 = 1 : φ，“find yours →”在下方留白的黄金分割点上（见 computeGeometry）；
    //   上半部分 : 下半部分的高 = φ : 1；
    //   上半部分的外框宽 : 高 = φ : 1，下半部分宽 : 高 = φ² : 1，算下来上口和底座一样宽
    heightRatio: 1 / PHI,    // 沙漏总高占屏幕高度的比例
    maxWidthOfScreen: 0.94,  // 竖屏时沙漏最宽处不超过屏幕宽度的比例
    upperHeight: 0.5,        // 上半部分（U 形漏斗）的高度
    neckLength: 0.07,        // 中间细通道的长度；越短上下两半越近
    lowerHeight: 0.5 / PHI,  // 下半部分的高度
    upperWidth: 0.5 * PHI,   // 上口宽度
    lowerWidth: 0.5 * PHI,   // 下半部分底宽（= 下半部分的高 × φ²）
    neckWidth: 0.03,         // 通道宽度
    upperCurve: 2.6,         // 上半部分轮廓：1 是直的 V 字，越大越像底部圆圆的 U 字
    lowerCurve: 1.2,         // 下半部分轮廓：1 是直的 ∧ 字，越大越像底部摊开的沙堆
  },


  // 性能较弱的设备（CPU 核数不超过 lowPower.cores）同时存在的词少一些
  lowPower: { cores: 4, upperWords: 36, lowerWords: 9, traces: 10 },

  pointerRadius: 0.024,      // 手指或鼠标推词的半径 ÷ 沙漏高度
  gravity: 1.6,
  maxPixelRatio: 2,
  debug: false,              // true 或网址加 ?debug 时画出看不见的墙
};
/* =========================================== */

const { Engine, Bodies, Body, Composite, Constraint, Sleeping, Detector } = Matter;

if ((navigator.hardwareConcurrency || 8) <= CONFIG.lowPower.cores) {
  CONFIG.minUpperWords = CONFIG.lowPower.upperWords;
  CONFIG.maxLowerWords = CONFIG.initialLowerCount = CONFIG.lowPower.lowerWords;
  CONFIG.trace.max = CONFIG.lowPower.traces;
}

// 同一个词里相邻的两节不互相碰撞，靠中间的弹簧保持形状；
// 正在被抽进瓶颈的那一句不碰别的句子，能从词堆里滑出来，不会推得整堆乱晃
let drainSid = -1;
let drainWord = null;
const canCollideDefault = Detector.canCollide;
Detector.canCollide = (fa, fb) => {
  const a = fa.seg, b = fb.seg;
  if (a && b) {
    if (a.word === b.word && (a.next === b || b.next === a)) return false;
    const wa = a.word, wb = b.word;
    if (wa.zone === "upper" && wb.zone === "upper" && wa.sid !== wb.sid &&
        (wa.sid === drainSid || wb.sid === drainSid)) return false;
    if (wa !== wb && wa.zone === "upper" && wb.zone === "upper" && (wa === drainWord || wb === drainWord)) return false;
  }
  return canCollideDefault(fa, fb);
};

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const DEBUG = CONFIG.debug || /[?&]debug/.test(location.search);
document.documentElement.style.background = CONFIG.colors.background;
document.body.style.background = CONFIG.colors.background;

const engine = Engine.create({ enableSleeping: true });
engine.positionIterations = 6;
engine.velocityIterations = 4;
engine.constraintIterations = 3;
const world = engine.world;

const STEP = 1 / 60;
const WORD = 0x0002;     // 词的碰撞类别；墙和手指是默认的 0x0001
const ENTER_ANGLE = -Math.PI / 2; // 竖直、句子开头朝下
let W = 0, H = 0, dpr = 1, G = null;
let walls = [];
// 词：{ text, isKey, sid, sizeRef, size, h, len, segs, zone, born, alpha, ... }
// 节：{ word, text, w, tx, body, next, prev, link, spring, alpha }
//   next / prev 是带子上的前后两节：上半部分跨词相连，下半部分只在词内相连
let words = [];          // 在物理世界里的词（上半部分、下半部分）
let queue = [];          // 上半部分的节，按被抽进瓶颈的先后排好（先来的句子在前，句内按顺序）
let chute = [];          // 正在通道里往下走的关键词 { word, pieces: [{ seg, y }], complete }
let plan = [];           // 正在被吃的那一句接下来的顺序 [{ g, angle }]：先从离瓶颈最近的词往左吃到句首，再往右吃到句尾
let leader = null;       // 正被抽进瓶颈的那一节
let crumbs = [];         // 被强制吃掉时还露在瓶颈口外的字母，原地很快淡掉
let follow = null;       // 同一个词的下一节：前一节一进通道就紧贴着接上，词在通道里不断开
let active = null;       // 正在上方显示的句子
let sentenceIdx = 0;
let simTime = 0;
const pushers = new Map();

const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const rot = (x, y, a) => ({ x: x * Math.cos(a) - y * Math.sin(a), y: x * Math.sin(a) + y * Math.cos(a) });
const fontStr = (size, weight = 400) => `${weight} ${size.toFixed(1)}px ${CONFIG.font.family}`;
const randWeight = () => CONFIG.font.weights[Math.floor(Math.random() * CONFIG.font.weights.length)];
const randSize = () => rand(CONFIG.font.sizeMin, CONFIG.font.sizeMax);
const chainGap = () => CONFIG.font.sizeMax * G.k * CONFIG.ribbon.gap;
const tail = (arr) => arr[arr.length - 1];

function measure(text, size, weight) {
  ctx.font = fontStr(size, weight);
  return ctx.measureText(text).width;
}

/* ---------- 几何 ---------- */

function computeGeometry() {
  const hg = CONFIG.hourglass;
  const frac = hg.upperHeight + hg.neckLength + hg.lowerHeight;
  const S = Math.min((H * hg.heightRatio) / frac, (W * hg.maxWidthOfScreen) / Math.max(hg.upperWidth, hg.lowerWidth));
  const k = S / 800;
  // 上方留白 : 下方留白 = 1 : φ
  const top = (H - S * frac) / (1 + PHI);
  const neckTop = top + S * hg.upperHeight;
  const neckBot = neckTop + S * hg.neckLength;
  const neckHalf = (S * hg.neckWidth) / 2;
  return {
    S, k,
    cx: W / 2, top, bottom: neckBot + S * hg.lowerHeight,
    neckTop, neckBot, neckLen: neckBot - neckTop, mid: (neckTop + neckBot) / 2,
    eatY: Math.min(neckTop + S * CONFIG.eatLine, neckBot - S * 0.025),
    neckHalf,
    // 通道出口要容得下一个竖着的词
    exitHalf: Math.max(neckHalf, CONFIG.font.sizeMax * k * 0.75),
    maxHalf: (S * hg.upperWidth) / 2,
    baseHalf: (S * hg.lowerWidth) / 2,
  };
}

// 某个高度上沙漏内壁到中线的距离
function halfAt(y) {
  const g = G, hg = CONFIG.hourglass;
  if (y <= g.top) return g.maxHalf;
  if (y >= g.bottom) return g.baseHalf;
  if (y < g.neckTop) {
    const v = (y - g.top) / (g.neckTop - g.top);
    return g.neckHalf + (g.maxHalf - g.neckHalf) * (1 - Math.pow(v, hg.upperCurve));
  }
  if (y <= g.neckBot) return g.neckHalf;
  const v = (y - g.neckBot) / (g.bottom - g.neckBot);
  return g.exitHalf + (g.baseHalf - g.exitHalf) * Math.pow(v, hg.lowerCurve);
}

function segmentWalls(pts, side, T) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    if (len < 0.5) continue;
    let nx = dy / len, ny = -dx / len;
    if (nx * side < 0) { nx = -nx; ny = -ny; }
    walls.push(Bodies.rectangle(
      (a.x + b.x) / 2 + (nx * T) / 2,
      (a.y + b.y) / 2 + (ny * T) / 2,
      len + T * 0.2, T,
      { isStatic: true, angle: Math.atan2(dy, dx), friction: 0.2 },
    ));
  }
}

function buildWalls() {
  if (walls.length) Composite.remove(world, walls);
  walls = [];
  const g = G, T = Math.max(40, g.S * 0.08), N = 14;
  for (const side of [-1, 1]) {
    const up = [{ x: g.cx + side * g.maxHalf, y: -T * 2 }];
    for (let i = 0; i <= N; i++) {
      const y = g.top + ((g.neckTop - g.top) * i) / N;
      up.push({ x: g.cx + side * halfAt(y), y });
    }
    segmentWalls(up, side, T);
    const low = [];
    for (let i = 0; i <= N; i++) {
      const y = g.neckBot + ((g.bottom - g.neckBot) * i) / N;
      low.push({ x: g.cx + side * halfAt(y), y });
    }
    segmentWalls(low, side, T);
  }
  // 瓶颈处的塞子：上下两边都过不去，只有程序能把词送过去
  walls.push(Bodies.rectangle(g.cx, g.mid, Math.max(g.neckHalf, g.exitHalf) * 2 + T, g.neckLen, { isStatic: true, friction: 0.2 }));
  walls.push(Bodies.rectangle(g.cx, g.bottom + T / 2, g.baseHalf * 2 + T * 2, T, { isStatic: true }));
  walls.push(Bodies.rectangle(W / 2, -T / 2, W + T * 4, T, { isStatic: true }));
  Composite.add(world, walls);
}

/* ---------- 词和节 ---------- */

// 把词平均切成几节，返回每节在原词里的起止位置
function splitText(text) {
  const c = CONFIG.ribbon.segChars;
  const n = text.length <= c + 1 ? 1 : Math.round(text.length / c);
  const parts = [];
  for (let k = 0; k < n; k++) parts.push([Math.round((k * text.length) / n), Math.round(((k + 1) * text.length) / n)]);
  return parts;
}

function makeWord(text, isKey, sid, sizeRef, zone, born, weight = randWeight()) {
  return { text, isKey, sid, sizeRef, zone, born, weight, segs: [], gone: new Set() };
}

// 把词的各节摆成一条直线，中心在 (x, y)、方向 angle，建好刚体并连好词内部的节。
// 已经被瓶颈吃掉的节（gone）不再建
function buildBodies(w, x, y, angle) {
  w.size = w.sizeRef * G.k;
  w.h = w.size * 1.08;
  const pad = w.size * 0.14;
  const parts = splitText(w.text);
  const segs = [];
  for (let i = 0; i < parts.length; i++) {
    if (w.gone.has(i)) continue;
    const [s, e] = parts[i];
    const tw = measure(w.text.slice(0, e), w.size, w.weight) - measure(w.text.slice(0, s), w.size, w.weight);
    const first = i === 0, end = i === parts.length - 1;
    segs.push({
      word: w,
      part: i,
      text: w.text.slice(s, e),
      w: tw + (first ? pad : 0) + (end ? pad : 0),
      tx: (first ? pad / 2 : 0) - (end ? pad / 2 : 0), // 文字相对节中心的偏移
    });
  }
  const L = segs.reduce((s, g) => s + g.w, 0);
  let off = -L / 2;
  for (const g of segs) {
    const o = rot(off + g.w / 2, 0, angle);
    makeBody(g, x + o.x, y + o.y, angle);
    off += g.w;
  }
  for (let i = 0; i < segs.length - 1; i++) linkSegs(segs[i], segs[i + 1], true);
  w.segs = segs;
  w.len = L;
}

function makeBody(g, x, y, angle) {
  const w = g.word;
  const b = Bodies.rectangle(x, y, g.w, w.h, {
    angle,
    friction: 0.45,
    frictionStatic: 0.9,
    frictionAir: w.zone === "upper" ? CONFIG.flow.upperAir : 0.012,
    restitution: 0.02,
    density: 0.0015,
    chamfer: { radius: Math.min(w.h * 0.2, g.w * 0.3, 3 * G.k + 1) },
    sleepThreshold: 45,
    collisionFilter: { category: WORD },
  });
  b.collisionFilter.seg = g;
  g.body = b;
  Composite.add(world, b);
}

// 连接前一节的右端和后一节的左端。词内部的两节贴紧，中心之间再加一根弹簧，
// 词弯了会慢慢弹回去；词与词之间留出词距，拉紧与否由 updateRibbons 管
function linkSegs(a, b, inner) {
  const len = inner ? 0.5 : Math.max(1, chainGap() - 0.14 * (a.word.size + b.word.size));
  const c = Constraint.create({
    bodyA: a.body, pointA: rot(a.w / 2, 0, a.body.angle),
    bodyB: b.body, pointB: rot(-b.w / 2, 0, b.body.angle),
    length: len,
    stiffness: inner ? 0.9 : 0,
    damping: inner ? 0.05 : 0,
  });
  c.target = len;
  c.outer = !inner;
  const add = [c];
  if (inner) {
    a.spring = Constraint.create({
      bodyA: a.body, bodyB: b.body,
      length: (a.w + b.w) / 2 + len,
      stiffness: CONFIG.ribbon.softness,
      damping: 0.05,
    });
    add.push(a.spring);
  }
  Composite.add(world, add);
  a.link = c;
  a.next = b;
  b.prev = a;
}

function unlinkSeg(a) {
  if (a.link) Composite.remove(world, a.link);
  if (a.spring) Composite.remove(world, a.spring);
  a.link = a.spring = null;
  if (a.next) a.next.prev = null;
  a.next = null;
}

function removeSeg(g) {
  if (g.prev) unlinkSeg(g.prev);
  unlinkSeg(g);
  Composite.remove(world, g.body);
  g.body = null;
  const w = g.word, i = w.segs.indexOf(g);
  if (i >= 0) w.segs.splice(i, 1);
  if (!w.segs.length) {
    const j = words.indexOf(w);
    if (j >= 0) words.splice(j, 1);
  }
}

function removeWord(w) {
  for (const g of w.segs.slice()) removeSeg(g);
}

function wake(zone) {
  for (const w of words) if (w.zone === zone) for (const g of w.segs) Sleeping.set(g.body, false);
}

// 词与词之间的带子只在两种时候拉紧：句子刚落下的几秒，以及正在被抽进瓶颈的那一句。
// 拉紧时以当时的长度为准，只拦住不让再拉开，不把词往一起拽；静静堆着时放松，相邻词照常碰撞，不会互相拉扯发抖
function updateRibbons(dt) {
  const head = queue[0] ? queue[0].word.sid : -1;
  for (const w of words) {
    if (w.zone !== "upper" || !w.segs.length) continue;
    const c = tail(w.segs).link;
    if (!c || !c.outer) continue;
    const on = (CONFIG.flow.order === "sentence" && w.sid === head) || simTime - w.born < CONFIG.ribbon.holdTime;
    if (!on) {
      c.stiffness = 0;
      c.damping = 0;
      c.on = false;
      continue;
    }
    if (!c.on) {
      const pa = Constraint.pointAWorld(c), pb = Constraint.pointBWorld(c);
      c.length = Math.max(c.target, Math.hypot(pa.x - pb.x, pa.y - pb.y));
      c.on = true;
    }
    c.length = Math.max(c.target, c.length - CONFIG.ribbon.reel * G.S * dt);
    c.stiffness = CONFIG.ribbon.stiffness;
    c.damping = 0.1;
  }
}

function count(zone) {
  let n = 0;
  for (const w of words) if (w.zone === zone && !w.fading && !w.trace) n++;
  return n;
}

function parseSentence(s) {
  return s.trim().split(/\s+/).map((tok) => {
    const m = tok.match(/^(.*)\[(.+?)\](.*)$/);
    return m ? { text: m[1] + m[2] + m[3], key: true } : { text: tok, key: false };
  });
}

function nextTokens() {
  const s = CONFIG.sentences[sentenceIdx % CONFIG.sentences.length];
  sentenceIdx++;
  return parseSentence(s).map((t) => ({ ...t, sid: sentenceIdx }));
}

// 把一个词放进上半部分，接在同一句的前一个词后面
function addUpperWord(w, x, y, prev) {
  buildBodies(w, x, y, 0);
  words.push(w);
  queue.push(...w.segs);
  if (prev && prev.zone === "upper" && prev.segs.length) linkSegs(tail(prev.segs), w.segs[0], false);
}

/* ---------- 上方显示的句子 ---------- */

function startDisplay() {
  active = {
    items: nextTokens().map((t) => ({ text: t.text, isKey: t.key, sid: t.sid, sizeRef: randSize(), weight: randWeight(), released: false })),
    t: 0,
    next: 0,
    prev: null,
  };
  layoutActive();
}

function layoutActive() {
  layoutItems(active.items);
}

// 把一句话排成一行，放不下时折行。flow.sideDrop 打开时一句靠左、一句靠右（按句子编号轮流），
// 落下时贴着杯壁补进来，中间从瓶颈漏走，表面就凹下去；关掉时居中
function layoutItems(items) {
  const side = CONFIG.flow.sideDrop && items.length ? (items[0].sid % 2 ? -1 : 1) : 0;
  const k = G.k;
  for (const it of items) {
    it.size = it.sizeRef * k;
    it.w = measure(it.text, it.size, it.weight);
  }
  const gap = chainGap();
  const maxW = G.maxHalf * 2 * 0.9;
  const lines = [[]];
  let lw = 0;
  for (const it of items) {
    const line = tail(lines);
    const add = (line.length ? gap : 0) + it.w;
    if (line.length && lw + add > maxW) { lines.push([it]); lw = it.w; }
    else { line.push(it); lw += add; }
  }
  const lineH = CONFIG.font.sizeMax * k * 1.5;
  let y = G.top + lineH * 0.6;
  for (const line of lines) {
    const total = line.reduce((s, it) => s + it.w, 0) + gap * (line.length - 1);
    let x = side < 0 ? G.cx - maxW / 2 : side > 0 ? G.cx + maxW / 2 - total : G.cx - total / 2;
    for (const it of line) {
      it.x = x + it.w / 2;
      it.y = y;
      x += it.w + gap;
    }
    y += lineH;
  }
}

function updateActive(dt) {
  active.t += dt;
  const items = active.items;
  while (active.next < items.length &&
         active.t >= CONFIG.sentenceHold + active.next * CONFIG.wordReleaseStagger) {
    const it = items[active.next++];
    it.released = true;
    const w = makeWord(it.text, it.isKey, it.sid, it.sizeRef, "upper", simTime, it.weight);
    addUpperWord(w, it.x, it.y, active.prev);
    const vx = rand(-0.15, 0.15) * G.k;
    for (const g of w.segs) Body.setVelocity(g.body, { x: vx, y: 0 });
    active.prev = w;
  }
  if (active.next >= items.length) active = null;
}

/* ---------- 瓶颈：带子从开头往里抽 ---------- */

// 为最早落下的那一句排好吃的顺序：离瓶颈口最近的词先吃，往左吃到句首（右端朝下进通道），
// 再从它右边的词往右吃到句尾（左端朝下）。横着落下的句子，中间的词往往离瓶颈最近
function planSentence() {
  const head = queue[0];
  if (!head) return;
  const sid = head.word.sid;
  const ws = [];
  for (const g of queue) if (g.word.sid === sid && !ws.includes(g.word)) ws.push(g.word);
  let best = 0, bd = Infinity;
  ws.forEach((w, i) => {
    for (const g of w.segs) {
      const d = Math.hypot(g.body.position.x - G.cx, g.body.position.y - G.neckTop);
      if (d < bd) { bd = d; best = i; }
    }
  });
  for (let i = best; i >= 0; i--) for (const g of ws[i].segs.slice().reverse()) plan.push({ g, angle: -ENTER_ANGLE });
  for (let i = best + 1; i < ws.length; i++) for (const g of ws[i].segs) plan.push({ g, angle: ENTER_ANGLE });
}

// 下一节交给程序：不再受物理影响，也不碰任何东西。
// 程序只拖它朝前的那一端（lead），另一端（trail）顺着拖动方向跟过来，像拖着一根棍子走，
// 不再有单独的旋转动作。往右吃时左端在前，往左吃时右端在前
// 谁离瓶颈口最近先吃谁：比较每个词两端到瓶颈口的距离，从近的那一端吃起，一个词吃完再挑下一个
function planNearest() {
  const mouth = { x: G.cx, y: G.neckTop };
  let best = null, bd = Infinity, fromLeft = true;
  for (const w of words) {
    if (w.zone !== "upper" || !w.segs.length || simTime - w.born < 0.3) continue;
    for (const [g, side] of [[w.segs[0], -1], [tail(w.segs), 1]]) {
      const b = g.body, o = rot((side * g.w) / 2, 0, b.angle);
      const d = Math.hypot(b.position.x + o.x - mouth.x, b.position.y + o.y - mouth.y);
      if (d < bd) { bd = d; best = w; fromLeft = side < 0; }
    }
  }
  if (!best) return;
  if (fromLeft) for (const g of best.segs) plan.push({ g, angle: ENTER_ANGLE });
  else for (const g of best.segs.slice().reverse()) plan.push({ g, angle: -ENTER_ANGLE });
}

function takeLeader() {
  if (!plan.length) (CONFIG.flow.order === "sentence" ? planSentence : planNearest)();
  while (plan.length && !plan[0].g.body) plan.shift();
  const item = plan.shift();
  if (!item) return null;
  const g = item.g, b = g.body, v = CONFIG.flowSpeed * G.S;
  const sgn = item.angle === ENTER_ANGLE ? -1 : 1;
  const lo = rot((sgn * g.w) / 2, 0, b.angle), to = rot((-sgn * g.w) / 2, 0, b.angle);
  const l = { g, base: item.angle, sgn,
    lead: { x: b.position.x + lo.x, y: b.position.y + lo.y },
    dir: { x: (to.x - lo.x) / g.w, y: (to.y - lo.y) / g.w } };
  if (follow && follow.g === g) {
    // 同一个词的下一节：前端紧贴着上一节的尾巴，速度不变，词在通道里不断开
    l.lead = { x: follow.x, y: follow.y };
    l.speed = v;
  } else {
    l.speed = Math.min(v, Math.hypot(b.velocity.x, b.velocity.y) * 60);
  }
  follow = null;
  Body.setStatic(b, true);
  b.collisionFilter.mask = 0;
  return l;
}

function updateFlow(dt) {
  if (!leader) leader = takeLeader();
  drainSid = leader && CONFIG.flow.order === "sentence" ? leader.g.word.sid : -1;
  drainWord = leader && CONFIG.flow.order !== "sentence" ? leader.g.word : null;
  if (!leader) return;
  const l = leader, g = l.g, b = g.body, v = CONFIG.flowSpeed * G.S;
  // 从这一节原来的速度慢慢加到带子的速度，不会猛地一拽
  l.speed = Math.min(v, l.speed + (v / 0.4) * dt);
  let move = l.speed * dt;
  // 前端先滑到瓶颈口正上方，再竖直往下进通道：竖着拖一段，词在进口之前就已经顺直了
  const lead = l.lead;
  const above = G.neckTop - g.w * 1.5;
  while (move > 0 && lead.y < G.neckTop) {
    const ty = lead.y < above && Math.abs(lead.x - G.cx) > 0.5 ? above : G.neckTop;
    const dx = G.cx - lead.x, dy = ty - lead.y, d = Math.hypot(dx, dy);
    if (d <= move) {
      lead.x = G.cx;
      lead.y = ty;
      move -= d;
    } else {
      lead.x += (dx * move) / d;
      lead.y += (dy * move) / d;
      move = 0;
    }
  }
  if (lead.y >= G.neckTop) {
    lead.y += move;
    lead.x = lerp(lead.x, G.cx, 0.2);
  }
  // 后端顺着拖过来；进了通道以后边走边慢慢顺直。转动有上限，不会突然甩一下，也不在口子上停下来转
  const trail = { x: lead.x + l.dir.x * g.w, y: lead.y + l.dir.y * g.w };
  let dx = trail.x - lead.x, dy = trail.y - lead.y;
  const d = Math.hypot(dx, dy) || 1;
  dx /= d;
  dy /= d;
  const depth = Math.max(0, lead.y - G.neckTop);
  const f = Math.min(1, depth / g.w), s = f * f * (3 - 2 * f);
  const want = Math.atan2(lerp(dy, -1, s), lerp(dx, 0, s));
  const cur = Math.atan2(l.dir.y, l.dir.x);
  let turn = want - cur;
  turn = Math.atan2(Math.sin(turn), Math.cos(turn));
  const lim = CONFIG.turnRate * dt;
  const ang = cur + Math.max(-lim, Math.min(lim, turn));
  dx = Math.cos(ang);
  dy = Math.sin(ang);
  l.dir = { x: dx, y: dy };
  l.trail = { x: lead.x + dx * g.w, y: lead.y + dy * g.w };
  if (!g.word.isKey) g.eating = true;
  const x = (lead.x + l.trail.x) / 2, y = (lead.y + l.trail.y) / 2;
  // 词的 x 轴从左端指向右端：左端在前时就是从前端指向后端
  const a = l.sgn < 0 ? Math.atan2(dy, dx) : Math.atan2(-dy, -dx);
  // 后端也过了吃掉的那条线才算吃完；斜着进去时前端会多走一段，但不超出通道
  if (lead.y - G.eatY >= g.w && (l.trail.y >= G.eatY - 0.5 || lead.y >= G.neckBot - g.w)) {
    swallow(g, l, a);
    leader = null;
    return;
  }
  Body.setPosition(b, { x, y });
  Body.setAngle(b, a);
  // 静态物体转动时约束的挂点不会跟着转，手动更新（往左吃时后面跟着的是前一节）
  if (g.link) {
    g.link.pointA = rot(g.w / 2, 0, a);
    g.link.angleA = a;
  }
  if (g.prev && g.prev.link) {
    g.prev.link.pointB = rot(-g.w / 2, 0, a);
    g.prev.link.angleB = a;
  }
}

// 这一节整个进了通道：普通词就此消失，关键词的各节继续往下走
function swallow(g, l, a) {
  const qi = queue.indexOf(g);
  if (qi >= 0) queue.splice(qi, 1);
  const w = g.word, angle = l.base;
  const x = (l.lead.x + l.trail.x) / 2, y = (l.lead.y + l.trail.y) / 2;
  const nx = plan[0] && plan[0].g;
  if (nx && nx.word === w && (nx === g.prev || nx === g.next)) follow = { g: nx, x: l.trail.x, y: l.trail.y };
  w.gone.add(g.part);
  if (!w.isKey) {
    for (const c of eatenLetters(g, w)) if (c.k > 0.01) crumbs.push({ ...c, alpha: c.k });
  }
  removeSeg(g);
  if (w.isKey) {
    let c = chute.find((c) => c.word === w);
    if (!c) {
      c = { word: w, angle, pieces: [] };
      chute.push(c);
    }
    c.pieces.push({ seg: g, x, y, a: angle + Math.atan2(Math.sin(a - angle), Math.cos(a - angle)) });
    if (!w.segs.length) c.complete = true;
  }
  // 叫醒上半部分，压在带子上的词才会落下来，不会悬在半空
  wake("upper");
}

function updateCrumbs(dt) {
  for (const c of crumbs) c.alpha -= dt / 0.25;
  if (crumbs.some((c) => c.alpha <= 0)) crumbs = crumbs.filter((c) => c.alpha > 0);
}

function updateChute(dt) {
  const v = CONFIG.flowSpeed * G.S;
  for (const c of chute) {
    const lim = CONFIG.turnRate * dt;
    for (const p of c.pieces) {
      p.y += v * dt;
      p.x = lerp(p.x, G.cx, 0.15);
      p.a += Math.max(-lim, Math.min(lim, c.angle - p.a));
    }
    // 整个词都出了通道，变回能弯的几节落下去
    const top = tail(c.pieces);
    if (c.complete && top.y - top.seg.w / 2 >= G.neckBot + 2 * G.k) {
      dropWord(c.word, top.y - top.seg.w / 2, c.angle);
      c.done = true;
    }
  }
  if (chute.some((c) => c.done)) chute = chute.filter((c) => !c.done);
}

// 关键词竖着离开通道：给一点随机转动，再随机让一节更重，每个词落下的姿态都不一样
function dropWord(w, topY, angle) {
  w.zone = "lower";
  w.born = simTime;
  w.gone = new Set();
  w.alpha = undefined;
  const size = w.sizeRef * G.k;
  const L = measure(w.text, size, w.weight) + size * 0.28;
  buildBodies(w, G.cx, topY + L / 2, angle);
  const heavy = w.segs[Math.floor(Math.random() * w.segs.length)];
  Body.setDensity(heavy.body, 0.0015 * rand(...CONFIG.heavyRange));
  const spin = (Math.random() < 0.5 ? -1 : 1) * rand(0.4, 1) * CONFIG.exitSpin;
  const vy = (CONFIG.flowSpeed * G.S) / 60;
  const cy = topY + w.len / 2;
  for (const g of w.segs) {
    const ry = g.body.position.y - cy;
    Body.setVelocity(g.body, { x: -spin * ry, y: vy });
    Body.setAngularVelocity(g.body, spin);
  }
  words.push(w);
}

// 中间一柱沉得快：摩擦小、多一点向下的力；两侧摩擦大。表面因此凹下去
function funnelFlow() {
  const f = CONFIG.flow.funnel;
  if (!f) return;
  const gs = engine.gravity.y * engine.gravity.scale * f.push;
  for (const w of words) {
    if (w.zone !== "upper") continue;
    for (const g of w.segs) {
      const b = g.body;
      if (b.isStatic) continue;
      const inside = Math.abs(b.position.x - G.cx) < halfAt(b.position.y) * f.width;
      b.friction = inside ? f.friction : f.sideFriction;
      if (inside && f.push) {
        if (b.isSleeping) Sleeping.set(b, false);
        Body.applyForce(b, b.position, { x: 0, y: b.mass * gs });
      }
    }
  }
}

/* ---------- 下半部分 ---------- */

function updateLower(dt) {
  const tr = CONFIG.trace;
  const live = words.filter((w) => w.zone === "lower" && !w.fading && !w.trace);
  if (live.length > CONFIG.maxLowerWords) {
    live.sort((a, b) => a.born - b.born);
    for (let i = 0; i < live.length - CONFIG.maxLowerWords; i++) {
      live[i].fading = true;
      live[i].fadeT = 0;
    }
  }

  // 痕迹太多，或者已经堆到通道出口附近，就让最老的痕迹淡掉
  const traces = words.filter((w) => w.trace && !w.retiring).sort((a, b) => a.born - b.born);
  const limitY = G.neckBot + G.S * tr.clearance;
  const rest = 0.2 * G.k;
  const tooHigh = words.some((w) => w.zone === "lower" && w.segs.some((g) =>
    (w.trace || g.body.speed < rest) && g.body.position.y - w.h / 2 < limitY));
  const retiring = words.filter((w) => w.retiring).length;
  if (traces.length && (traces.length > tr.max || tooHigh) && retiring < (tooHigh || traces.length > tr.max + 2 ? 3 : 1)) {
    traces[0].retiring = true;
    traces[0].fadeT = 0;
  }

  for (const w of words.slice()) {
    if (w.fading) {
      w.fadeT += dt;
      const u = Math.min(1, w.fadeT / CONFIG.fade.lowerOverflow);
      w.alpha = lerp(1, tr.alpha, u);
      if (u >= 1) makeTrace(w);
    } else if (w.retiring) {
      w.fadeT += dt;
      w.alpha = tr.alpha * Math.max(0, 1 - w.fadeT / tr.retire);
      if (w.fadeT >= tr.retire) {
        removeWord(w);
        wake("lower");
      }
    }
  }
}

function makeTrace(w) {
  w.fading = false;
  w.trace = true;
  w.alpha = CONFIG.trace.alpha;
}

// 通道出口下方第一个放得下这个词横躺的高度（开场预置用）
function lowerDropY(len) {
  let y = G.neckBot + G.S * 0.04;
  while (y < G.bottom - G.S * 0.05 && halfAt(y) < len / 2 + 3 * G.k) y += 2;
  return y;
}

/* ---------- 交互 ---------- */

function movePushers() {
  const maxStep = G.S * 0.035;
  for (const p of pushers.values()) {
    const b = p.body;
    const ox = b.position.x, oy = b.position.y;
    const dx = p.tx - ox, dy = p.ty - oy, d = Math.hypot(dx, dy);
    const s = d > maxStep ? maxStep / d : 1;
    const nx = ox + dx * s, ny = oy + dy * s;
    Body.setPosition(b, { x: nx, y: ny });
    // 静态物体不会自己更新上一帧位置，手动设好，碰撞才会带出推力
    b.positionPrev.x = ox;
    b.positionPrev.y = oy;
    b.velocity.x = nx - ox;
    b.velocity.y = ny - oy;
    b.speed = Math.hypot(b.velocity.x, b.velocity.y);
    const reach = p.r + G.S * 0.06;
    for (const w of words) {
      for (const g of w.segs) {
        const q = g.body.position;
        if (Math.abs(q.x - nx) < reach + g.w / 2 && Math.abs(q.y - ny) < reach + g.w / 2) Sleeping.set(g.body, false);
      }
    }
  }
}

function pointerPos(e) {
  return { x: e.clientX, y: e.clientY };
}

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  const { x, y } = pointerPos(e);
  const r = G.S * CONFIG.pointerRadius;
  const body = Bodies.circle(x, y, r, { isStatic: true, friction: 0.3 });
  Composite.add(world, body);
  pushers.set(e.pointerId, { body, r, tx: x, ty: y });
});
canvas.addEventListener("pointermove", (e) => {
  const p = pushers.get(e.pointerId);
  if (!p) return;
  const { x, y } = pointerPos(e);
  p.tx = x;
  p.ty = y;
});
function endPointer(e) {
  const p = pushers.get(e.pointerId);
  if (!p) return;
  Composite.remove(world, p.body);
  pushers.delete(e.pointerId);
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("lostpointercapture", endPointer);

function clearPushers() {
  for (const p of pushers.values()) Composite.remove(world, p.body);
  pushers.clear();
}

// 禁止滚动、下拉刷新、双指缩放
const stop = (e) => e.preventDefault();
document.addEventListener("touchmove", stop, { passive: false });
document.addEventListener("touchstart", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener("gesturestart", stop);
document.addEventListener("dblclick", stop);
document.addEventListener("contextmenu", stop);
document.addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

/* ---------- 兜底：交互不能破坏过滤 ---------- */

function clampSegs() {
  const g = G, maxV = g.S * 0.05;
  for (const w of words) {
    const m = w.h / 2;
    for (const s of w.segs) {
      const b = s.body;
      if (b.isStatic) continue;
      const v = b.velocity, sp = Math.hypot(v.x, v.y);
      if (sp > maxV) Body.setVelocity(b, { x: (v.x * maxV) / sp, y: (v.y * maxV) / sp });

      const p = b.position;
      let x = p.x, y = p.y;
      if (w.zone === "upper") {
        y = Math.min(y, g.neckTop - m * 0.5);
        y = Math.max(y, m);
      } else {
        y = Math.max(y, g.neckBot + m * 0.5);
        y = Math.min(y, g.bottom - m * 0.5);
      }
      const half = halfAt(y);
      if (Math.abs(x - g.cx) > half + 1) x = g.cx + Math.sign(x - g.cx) * Math.max(0, half - m);
      x = Math.min(Math.max(x, m), W - m);
      if (x !== p.x || y !== p.y) {
        Body.setPosition(b, { x, y });
        Body.setVelocity(b, { x: 0, y: 0 });
      }
    }
  }
}

/* ---------- 尺寸 ---------- */

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  const old = G;
  G = computeGeometry();
  engine.gravity.scale = 0.001 * G.k * CONFIG.gravity;
  buildWalls();
  placeFind();
  if (!old) return;
  clearPushers();
  if (leader) {
    leader.g.eating = false;
    leader = null;
  }
  follow = null;
  plan = [];
  // 每个词按原来的中心和方向重建成直的；带子的前后关系照旧
  const f = G.S / old.S;
  const order = [];
  for (const g of queue) if (!order.includes(g.word)) order.push(g.word);
  const nextWord = new Map();
  for (const w of words) {
    const c = w.segs.length && tail(w.segs).link;
    if (c && c.outer) nextWord.set(w, tail(w.segs).next.word);
  }
  const poses = new Map();
  for (const w of words) {
    const a = w.segs[0].body.position, z = tail(w.segs).body.position;
    const ang = w.segs.length > 1 ? Math.atan2(z.y - a.y, z.x - a.x) : w.segs[0].body.angle;
    poses.set(w, { x: G.cx + ((a.x + z.x) / 2 - old.cx) * f, y: G.mid + ((a.y + z.y) / 2 - old.mid) * f, ang });
  }
  for (const w of words) {
    for (const g of w.segs) {
      unlinkSeg(g);
      Composite.remove(world, g.body);
    }
  }
  for (const w of words) {
    const p = poses.get(w);
    buildBodies(w, p.x, p.y, p.ang);
  }
  for (const [w, nw] of nextWord) if (w.segs.length && nw.segs.length) linkSegs(tail(w.segs), nw.segs[0], false);
  queue = order.flatMap((w) => w.segs);
  // 通道里的关键词：已经整个进去的直接从出口落下，没进完的等剩下的几节
  for (const c of chute) {
    if (c.complete) {
      dropWord(c.word, G.neckBot + 2 * G.k, c.angle);
      c.done = true;
    } else {
      c.pieces = [];
    }
  }
  chute = chute.filter((c) => !c.done);
  if (active) layoutActive();
}

// 入口放在沙漏下方留白的黄金分割点上
const find = document.getElementById("find");
function placeFind() {
  // 下方留白的黄金分割点：离沙漏近、离屏幕底边远
  find.style.top = `${G.bottom + (H - G.bottom) / (PHI * PHI)}px`;
}

let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 120);
});

/* ---------- 开场：上半部分堆好，下半部分预置 ---------- */

function prefill() {
  const settle = (steps, each) => {
    for (let i = 0; i < steps; i++) {
      if (each) each(i);
      simTime += STEP;
      updateRibbons(STEP);
      Engine.update(engine, 1000 / 60);
      clampSegs();
    }
  };

  // 上半部分：一句句从上面落下去，自然堆成一堆软带子
  let guard = 0;
  while (count("upper") < CONFIG.minUpperWords && guard++ < 50) {
    const items = nextTokens().map((t) => ({ text: t.text, isKey: t.key, sid: t.sid, sizeRef: randSize(), weight: randWeight() }));
    layoutItems(items);
    let prev = null;
    for (const it of items) {
      const w = makeWord(it.text, it.isKey, it.sid, it.sizeRef, "upper", simTime, it.weight);
      addUpperWord(w, it.x, it.y, prev);
      prev = w;
    }
    settle(40);
  }
  settle(60);

  // 下半部分先铺一层旧痕迹
  const keys = CONFIG.sentences.flatMap((s) => parseSentence(s).filter((t) => t.key).map((t) => t.text));
  for (let i = 0; i < CONFIG.trace.initial; i++) {
    const w = makeWord(keys[i % keys.length], true, -1, randSize(), "lower", -1000 + i);
    const y = G.bottom - rand(0.02, 0.14) * G.S;
    buildBodies(w, G.cx + rand(-0.7, 0.7) * halfAt(y), y, rand(-0.5, 0.5));
    makeTrace(w);
    words.push(w);
  }
  settle(90);

  // 预置的词从不同位置一个个落到痕迹上
  const pool = [...CONFIG.initialLowerWords, ...keys];
  const n = CONFIG.initialLowerCount;
  settle(n * 12 + 90, (i) => {
    if (i % 12 || i / 12 >= n) return;
    const j = i / 12;
    const w = makeWord(pool[j % pool.length], true, -1, randSize(), "lower", -100 + j);
    const y = G.neckBot + G.S * rand(0.06, 0.12);
    buildBodies(w, G.cx + rand(-0.6, 0.6) * halfAt(y), y, rand(-0.3, 0.3));
    words.push(w);
  });
}

/* ---------- 句子数据 ---------- */

// hourglass-sentences.json 每句给出 text 和 keywords；转成和备用句子一样的方括号格式
async function loadSentences() {
  try {
    const r = await fetch(CONFIG.sentencesUrl);
    const data = await r.json();
    const list = data.sentences.map((s) => s.text.split(/\s+/).map((tok) => {
      const bare = tok.replace(/^[^\w]+|[^\w]+$/g, "");
      return s.keywords.includes(bare) ? tok.replace(bare, `[${bare}]`) : tok;
    }).join(" "));
    if (list.length) CONFIG.sentences = list;
  } catch (e) {}
}

/* ---------- 主循环 ---------- */

function step(dt) {
  simTime += dt;
  if (!active && count("upper") < CONFIG.minUpperWords) startDisplay();
  if (active) updateActive(dt);
  updateFlow(dt);
  updateChute(dt);
  updateCrumbs(dt);
  updateLower(dt);
  movePushers();
  funnelFlow();
  updateRibbons(dt);
  Engine.update(engine, 1000 / 60);
  clampSegs();
}

function drawText(text, size, x, y, angle, alpha, weight) {
  ctx.globalAlpha = alpha;
  ctx.font = fontStr(size, weight);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillText(text, 0, 0);
}

function drawDebug() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = "#c33";
  ctx.lineWidth = 1;
  for (const b of [...walls, ...[...pushers.values()].map((p) => p.body)]) {
    ctx.beginPath();
    b.vertices.forEach((v, i) => (i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y)));
    ctx.closePath();
    ctx.stroke();
  }
}

// 正被吃的非关键词逐个字母消失：哪个字母越过了吃掉的那条线（瓶颈口往下一点），哪个字母就很快淡掉
function eatenLetters(g, w) {
  const b = g.body, a = b.angle, size = w.size;
  if (!g.chars) {
    ctx.font = fontStr(size, w.weight);
    let x = g.tx - ctx.measureText(g.text).width / 2;
    g.chars = [...g.text].map((ch) => {
      const cw = ctx.measureText(ch).width;
      const c = { ch, off: x + cw / 2 };
      x += cw;
      return c;
    });
  }
  const fadeLen = size * 0.2;
  return g.chars.map((c) => {
    const o = rot(c.off, 0, a);
    const x = b.position.x + o.x, y = b.position.y + o.y;
    return { ch: c.ch, size, weight: w.weight, x, y, a, k: Math.max(0, Math.min(1, 1 - (y - G.eatY) / fadeLen)) };
  });
}

function drawEaten(g, w, alpha) {
  for (const c of eatenLetters(g, w)) if (c.k > 0.01) drawText(c.ch, c.size, c.x, c.y, c.a, alpha * c.k, c.weight);
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = CONFIG.colors.background;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = CONFIG.colors.text;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const w of words) {
    const wa = w.alpha === undefined ? 1 : w.alpha;
    for (const g of w.segs) {
      if (g.eating) {
        drawEaten(g, w, wa);
        continue;
      }
      const b = g.body, o = rot(g.tx, 0, b.angle);
      drawText(g.text, w.size, b.position.x + o.x, b.position.y + o.y, b.angle, wa, w.weight);
    }
  }
  for (const c of crumbs) drawText(c.ch, c.size, c.x, c.y, c.a, c.alpha, c.weight);
  for (const c of chute) {
    for (const p of c.pieces) {
      const o = rot(p.seg.tx, 0, p.a);
      drawText(p.seg.text, c.word.size, p.x + o.x, p.y + o.y, p.a, 1, c.word.weight);
    }
  }
  if (active) {
    const alpha = Math.min(1, active.t / 0.35);
    for (const it of active.items) if (!it.released) drawText(it.text, it.size, it.x, it.y, 0, alpha, it.weight);
  }
  if (DEBUG) drawDebug();
  ctx.globalAlpha = 1;
}

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  let n = 0;
  while (acc >= STEP && n < 4) { step(STEP); acc -= STEP; n++; }
  if (n === 4) acc = 0;
  draw();
  requestAnimationFrame(frame);
}

const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
await Promise.race([
  Promise.all([loadSentences(), ...CONFIG.font.weights.map((w) => document.fonts.load(fontStr(20, w), "Aa"))]).catch(() => {}),
  new Promise((r) => setTimeout(r, 2000)),
]);
resize();
prefill();
if (REDUCE) {
  draw();
  window.addEventListener("resize", () => setTimeout(draw, 200));
} else {
  startDisplay();
  requestAnimationFrame((t) => { last = t; frame(t); });
}
</script>
</body>
