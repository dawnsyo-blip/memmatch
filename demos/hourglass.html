<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Word Hourglass</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #F4F3EF;
  }
  body {
    position: fixed;
    inset: 0;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
/* ================= 可调参数 ================= */
const CONFIG = {
  // 句子按顺序循环使用；方括号里的词能通过瓶颈，显示时不带方括号
  // 句子来自 hourglass-sentences.json
  sentences: [
    "I've [seen] things you wouldn't believe",
    "I watched [C-beams] [glitter] in the dark",
    "like [tears] in [rain]",
    "I want more [life]",
    "meet me in [Montauk]",
    "I loved you on this [day]",
    "I love this [memory]",
    "you can [erase] someone from your [mind]",
    "we all need [mirrors] to know who we are",
    "when my [eyes] are closed",
    "the [world] is still there",
    "I looked into his [eyes] and saw [recognition]",
    "I used to think this was your [story]",
    "[memory] doesn't work like I thought",
    "we are so bound by [time]",
    "each time you hear a sad [guitar]",
    "the [memories] I value most don't [fade]",
    "I could recall every [leaf] on every [tree]",
    "I keep [dreaming] of a [house] by the [sea]",
    "your [voice] was the last thing I [lost]",
  ],

  flowSpeed: 0.2,            // 带子被抽进瓶颈的速度：每秒走过沙漏高度的几分之一
  minUpperWords: 40,         // 上半部分低于这个数就补下一句
  maxLowerWords: 12,         // 下半部分最多保留几个清楚的词
  initialLowerCount: 12,     // 页面打开时下半部分预置几个清楚的词
  initialLowerWords: ["tears", "rain", "mirrors", "Montauk", "glitter", "life"], // 预置词，不够时接着用句子里的关键词

  sentenceHold: 1.2,         // 秒，新句子完整显示多久后松开
  wordReleaseStagger: 0.08,  // 秒，从第一个词开始逐个松开的间隔

  fade: {
    lowerOverflow: 3,        // 秒，下半部分超出上限时最旧的词褪成痕迹
  },

  // 下半部分的旧词褪成很淡的痕迹留在原处，新词压在上面，慢慢把下半部分的轮廓撑出来
  trace: {
    alpha: 0.16,             // 痕迹的不透明度
    max: 30,                 // 最多保留多少个痕迹，超过时最老的淡掉
    initial: 14,             // 页面打开时预置多少个痕迹
    retire: 2.5,             // 秒，最老的痕迹淡掉所用的时间
    clearance: 0.08,         // 痕迹堆到离通道出口这么近（÷ 沙漏高度）时，最老的痕迹先淡掉
  },

  // 一句话是一条软带子：词首尾相连，可以弯折、盘起来
  ribbon: {
    gap: 0.38,               // 词与词的间距 ÷ 最大字号（也是句子显示时的词距）
    stiffness: 0.3,          // 带子拉紧时的硬度，0～1，越小越能拉长
    holdTime: 3,             // 秒，句子落下后带子保持拉紧多久；之后放松，静静堆着的词才不会互相拉扯发抖
  },

  colors: {
    background: "#F4F3EF",
    text: "#111111",
  },

  font: {
    family: 'Georgia, "Times New Roman", serif',
    // 字号范围：沙漏高 800px 时的像素值，随沙漏大小等比缩放
    sizeMin: 15,
    sizeMax: 23,
  },

  // 以下比例都是相对整个沙漏的高度
  hourglass: {
    heightRatio: 0.86,       // 沙漏高度占屏幕高度的比例
    maxWidthOfScreen: 0.94,  // 竖屏时沙漏最宽处不超过屏幕宽度的比例
    upperHeight: 0.5,        // 上半部分（杯形漏斗）的高度
    neckLength: 0.16,        // 中间细通道的长度；剩下的是下半部分
    upperWidth: 0.62,        // 上口宽度
    lowerWidth: 0.72,        // 下半部分底宽
    neckWidth: 0.03,         // 通道宽度
    upperCurve: 1.4,         // 上半部分轮廓：1 是直的 V 字，越大杯底越圆
    lowerCurve: 1.2,         // 下半部分轮廓：1 是直的 ∧ 字，越大越像底部摊开的沙堆
  },

  pointerRadius: 0.024,      // 手指或鼠标推词的半径 ÷ 沙漏高度
  gravity: 1.6,
  maxPixelRatio: 2,
  debug: false,              // true 或网址加 ?debug 时画出看不见的墙
};
/* =========================================== */

const { Engine, Bodies, Body, Composite, Constraint, Sleeping, Detector } = Matter;

// 正在被抽进瓶颈的那一句不碰别的句子，能从词堆里滑出来，不会推得整堆乱晃
let drainSid = -1;
const canCollideDefault = Detector.canCollide;
Detector.canCollide = (fa, fb) => {
  const a = fa.word, b = fb.word;
  if (a && b) {
    if (a.sid !== b.sid && (a.sid === drainSid || b.sid === drainSid)) return false;
  }
  return canCollideDefault(fa, fb);
};

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const DEBUG = CONFIG.debug || /[?&]debug/.test(location.search);
document.documentElement.style.background = CONFIG.colors.background;
document.body.style.background = CONFIG.colors.background;

const engine = Engine.create({ enableSleeping: true });
engine.positionIterations = 8;
engine.velocityIterations = 6;
engine.constraintIterations = 3;
const world = engine.world;

const STEP = 1 / 60;
const WORD = 0x0002;     // 词的碰撞类别；墙和手指是默认的 0x0001
let W = 0, H = 0, dpr = 1, G = null;
let walls = [];
let words = [];          // 在物理世界里的词，zone 为 upper 或 lower
let queue = [];          // 上半部分的词，按被抽进瓶颈的先后排好（先来的句子在前，句内按词序）
let anims = [];          // 已经穿过瓶颈、正在通道里往下走的关键词
let leader = null;       // 正被抽进瓶颈的那个词
let active = null;       // 正在上方显示的句子
let sentenceIdx = 0;
let simTime = 0;
const pushers = new Map();

const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const rot = (x, y, a) => ({ x: x * Math.cos(a) - y * Math.sin(a), y: x * Math.sin(a) + y * Math.cos(a) });
const fontStr = (size) => `${size.toFixed(1)}px ${CONFIG.font.family}`;
const randSize = () => rand(CONFIG.font.sizeMin, CONFIG.font.sizeMax);
const chainGap = () => CONFIG.font.sizeMax * G.k * CONFIG.ribbon.gap;
const ENTER_ANGLE = -Math.PI / 2; // 竖直、句子开头朝下

function measure(text, size) {
  ctx.font = fontStr(size);
  return ctx.measureText(text).width;
}

/* ---------- 几何 ---------- */

function computeGeometry() {
  const hg = CONFIG.hourglass;
  const S = Math.min(H * hg.heightRatio, (W * hg.maxWidthOfScreen) / Math.max(hg.upperWidth, hg.lowerWidth));
  const k = S / 800;
  const top = (H - S) / 2;
  const neckTop = top + S * hg.upperHeight;
  const neckBot = neckTop + S * hg.neckLength;
  const neckHalf = (S * hg.neckWidth) / 2;
  return {
    S, k,
    cx: W / 2, top, bottom: top + S,
    neckTop, neckBot, neckLen: neckBot - neckTop, mid: (neckTop + neckBot) / 2,
    neckHalf,
    // 通道出口要容得下一个竖着的词
    exitHalf: Math.max(neckHalf, CONFIG.font.sizeMax * k * 0.75),
    maxHalf: (S * hg.upperWidth) / 2,
    baseHalf: (S * hg.lowerWidth) / 2,
  };
}

// 某个高度上沙漏内壁到中线的距离
function halfAt(y) {
  const g = G, hg = CONFIG.hourglass;
  if (y <= g.top) return g.maxHalf;
  if (y >= g.bottom) return g.baseHalf;
  if (y < g.neckTop) {
    const v = (y - g.top) / (g.neckTop - g.top);
    return g.neckHalf + (g.maxHalf - g.neckHalf) * (1 - Math.pow(v, hg.upperCurve));
  }
  if (y <= g.neckBot) return g.neckHalf;
  const v = (y - g.neckBot) / (g.bottom - g.neckBot);
  return g.exitHalf + (g.baseHalf - g.exitHalf) * Math.pow(v, hg.lowerCurve);
}

function segmentWalls(pts, side, T) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    if (len < 0.5) continue;
    let nx = dy / len, ny = -dx / len;
    if (nx * side < 0) { nx = -nx; ny = -ny; }
    walls.push(Bodies.rectangle(
      (a.x + b.x) / 2 + (nx * T) / 2,
      (a.y + b.y) / 2 + (ny * T) / 2,
      len + T * 0.2, T,
      { isStatic: true, angle: Math.atan2(dy, dx), friction: 0.2 },
    ));
  }
}

function buildWalls() {
  if (walls.length) Composite.remove(world, walls);
  walls = [];
  const g = G, T = Math.max(40, g.S * 0.08), N = 30;
  for (const side of [-1, 1]) {
    const up = [{ x: g.cx + side * g.maxHalf, y: -T * 2 }];
    for (let i = 0; i <= N; i++) {
      const y = g.top + ((g.neckTop - g.top) * i) / N;
      up.push({ x: g.cx + side * halfAt(y), y });
    }
    segmentWalls(up, side, T);
    const low = [];
    for (let i = 0; i <= N; i++) {
      const y = g.neckBot + ((g.bottom - g.neckBot) * i) / N;
      low.push({ x: g.cx + side * halfAt(y), y });
    }
    segmentWalls(low, side, T);
  }
  // 瓶颈处的塞子：上下两边都过不去，只有程序能把词送过去
  walls.push(Bodies.rectangle(g.cx, g.mid, Math.max(g.neckHalf, g.exitHalf) * 2 + T, g.neckLen, { isStatic: true, friction: 0.2 }));
  walls.push(Bodies.rectangle(g.cx, g.bottom + T / 2, g.baseHalf * 2 + T * 2, T, { isStatic: true }));
  walls.push(Bodies.rectangle(W / 2, -T / 2, W + T * 4, T, { isStatic: true }));
  Composite.add(world, walls);
}

/* ---------- 词 ---------- */

function attachBody(w, x, y, angle) {
  w.size = w.sizeRef * G.k;
  w.w = measure(w.text, w.size) + w.size * 0.28;
  w.h = w.size * 1.08;
  const b = Bodies.rectangle(x, y, w.w, w.h, {
    angle,
    friction: 0.45,
    frictionStatic: 0.9,
    frictionAir: 0.012,
    restitution: 0.02,
    density: 0.0015,
    chamfer: { radius: Math.min(w.h * 0.22, 3 * G.k + 1) },
    sleepThreshold: 45,
    collisionFilter: { category: WORD },
  });
  b.word = w;
  b.collisionFilter.word = w;
  w.body = b;
  Composite.add(world, b);
  return b;
}

// 把前一个词的右端和后一个词的左端连起来，成为带子的一节
function link(a, b) {
  const c = Constraint.create({
    bodyA: a.body, pointA: rot(a.w / 2, 0, a.body.angle),
    bodyB: b.body, pointB: rot(-b.w / 2, 0, b.body.angle),
    length: Math.max(1, chainGap() - 0.14 * (a.size + b.size)),
    stiffness: 0,
    damping: 0,
  });
  Composite.add(world, c);
  a.link = c;
  a.next = b;
  b.prev = a;
}

function unlink(a) {
  if (a.link) Composite.remove(world, a.link);
  a.link = null;
  if (a.next) a.next.prev = null;
  a.next = null;
}

function removeWord(w) {
  if (w.prev) unlink(w.prev);
  unlink(w);
  Composite.remove(world, w.body);
  w.body = null;
  const i = words.indexOf(w);
  if (i >= 0) words.splice(i, 1);
}

// 带子只在两种时候拉紧：句子刚落下的几秒，以及正在被抽进瓶颈的那一句。
// 静静堆着时放松，相邻两个词照常碰撞，带子不会对折，也不会和碰撞互相拉扯发抖
function updateRibbons() {
  const head = queue[0] ? queue[0].sid : -1;
  for (const w of words) {
    const c = w.link;
    if (!c) continue;
    const on = w.sid === head || simTime - w.born < CONFIG.ribbon.holdTime;
    c.stiffness = on ? CONFIG.ribbon.stiffness : 0;
    c.damping = on ? 0.1 : 0;
  }
}

function wake(zone) {
  for (const w of words) if (w.zone === zone) Sleeping.set(w.body, false);
}

function count(zone) {
  let n = 0;
  for (const w of words) if (w.zone === zone && !w.fading && !w.trace) n++;
  return n;
}

function parseSentence(s) {
  return s.trim().split(/\s+/).map((tok) => {
    const m = tok.match(/^(.*)\[(.+?)\](.*)$/);
    return m ? { text: m[1] + m[2] + m[3], key: true } : { text: tok, key: false };
  });
}

function nextTokens() {
  const s = CONFIG.sentences[sentenceIdx % CONFIG.sentences.length];
  sentenceIdx++;
  return parseSentence(s).map((t) => ({ ...t, sid: sentenceIdx }));
}

/* ---------- 上方显示的句子 ---------- */

function startDisplay() {
  active = {
    items: nextTokens().map((t) => ({ text: t.text, isKey: t.key, sid: t.sid, sizeRef: randSize(), released: false })),
    t: 0,
    next: 0,
    prev: null,
  };
  layoutActive();
}

function layoutActive() {
  layoutItems(active.items);
}

// 把一句话排成居中的一行，放不下时折行
function layoutItems(items) {
  const k = G.k;
  for (const it of items) {
    it.size = it.sizeRef * k;
    it.w = measure(it.text, it.size);
  }
  const gap = chainGap();
  const maxW = G.maxHalf * 2 * 0.9;
  const lines = [[]];
  let lw = 0;
  for (const it of items) {
    const line = lines[lines.length - 1];
    const add = (line.length ? gap : 0) + it.w;
    if (line.length && lw + add > maxW) { lines.push([it]); lw = it.w; }
    else { line.push(it); lw += add; }
  }
  const lineH = CONFIG.font.sizeMax * k * 1.5;
  let y = G.top + lineH * 0.6;
  for (const line of lines) {
    const total = line.reduce((s, it) => s + it.w, 0) + gap * (line.length - 1);
    let x = G.cx - total / 2;
    for (const it of line) {
      it.x = x + it.w / 2;
      it.y = y;
      x += it.w + gap;
    }
    y += lineH;
  }
}

function updateActive(dt) {
  active.t += dt;
  const items = active.items;
  while (active.next < items.length &&
         active.t >= CONFIG.sentenceHold + active.next * CONFIG.wordReleaseStagger) {
    const it = items[active.next++];
    it.released = true;
    const w = { text: it.text, isKey: it.isKey, sid: it.sid, sizeRef: it.sizeRef, zone: "upper", born: simTime };
    attachBody(w, it.x, it.y, 0);
    Body.setVelocity(w.body, { x: rand(-0.15, 0.15) * G.k, y: 0 });
    Body.setAngularVelocity(w.body, rand(-0.01, 0.01));
    words.push(w);
    queue.push(w);
    // 前一个词还在上半部分就连上；已经被瓶颈处理掉的就不连了
    if (active.prev && active.prev.zone === "upper") link(active.prev, w);
    active.prev = w;
  }
  if (active.next >= items.length) active = null;
}

/* ---------- 瓶颈：带子从开头往里抽 ---------- */

function nearestAngle(target, a) {
  return target + 2 * Math.PI * Math.round((a - target) / (2 * Math.PI));
}

// 带子最前面的词交给程序：不再受物理影响，也不碰任何东西
function takeLeader() {
  const w = queue[0];
  if (!w) return null;
  Body.setStatic(w.body, true);
  w.body.collisionFilter.mask = 0;
  return { w, phase: "approach", target: nearestAngle(ENTER_ANGLE, w.body.angle) };
}

function updateFlow(dt) {
  if (!leader) leader = takeLeader();
  drainSid = leader ? leader.w.sid : -1;
  if (!leader) return;
  const w = leader.w, b = w.body;
  let move = CONFIG.flowSpeed * G.S * dt;
  let x = b.position.x, y = b.position.y, a = b.angle;
  if (leader.phase === "approach") {
    // 匀速滑向瓶颈口，一边滑一边转成竖直
    const tx = G.cx, ty = G.neckTop - w.w / 2;
    const d = Math.hypot(tx - x, ty - y);
    if (d <= move) {
      x = tx; y = ty; a = leader.target;
      leader.phase = "enter";
      move -= d;
    } else {
      const f = move / d;
      x += (tx - x) * f;
      y += (ty - y) * f;
      a += (leader.target - a) * f;
      move = 0;
    }
  }
  if (leader.phase === "enter") {
    // 开头朝下钻进通道；普通词边进边淡，整个进去时正好消失
    y += move;
    const p = y + w.w / 2 - G.neckTop;
    if (!w.isKey) w.alpha = Math.max(0, 1 - p / w.w);
    if (p >= w.w) {
      swallow(w, y);
      leader = null;
      return;
    }
  }
  Body.setPosition(b, { x, y });
  Body.setAngle(b, a);
  // 静态物体转动时约束的挂点不会跟着转，手动更新
  if (w.link) {
    w.link.pointA = rot(w.w / 2, 0, a);
    w.link.angleA = a;
  }
}

// 这个词整个进了通道：普通词就此消失，关键词继续往下走
function swallow(w, y) {
  queue.shift();
  removeWord(w);
  if (w.isKey) {
    w.zone = "anim";
    w.alpha = undefined;
    anims.push({ w, x: G.cx, y, y0: y, a: ENTER_ANGLE, aEnd: rand(-0.2, 0.2), alpha: 1 });
  }
  // 叫醒上半部分，压在带子上的词才会落下来，不会悬在半空
  wake("upper");
}

// 通道下方第一个放得下这个词横躺的高度
function exitY(w) {
  let y = G.neckBot + w.h;
  while (y < G.bottom - w.h && halfAt(y) < w.w / 2 + 3 * G.k) y += 2;
  return y;
}

function updateAnims(dt) {
  const v = CONFIG.flowSpeed * G.S;
  for (const a of anims) {
    // 以带子的速度走完通道，快出通道时慢慢放平，横着落下去
    const w = a.w;
    if (a.yB === undefined) a.yB = exitY(w);
    a.x = G.cx;
    a.y = Math.min(a.yB, a.y + v * dt);
    const y0 = Math.max(a.y0, G.neckBot - w.w / 2);
    const r = Math.min(1, Math.max(0, (a.y - y0) / Math.max(1, a.yB - y0)));
    a.a = lerp(ENTER_ANGLE, a.aEnd, r * r * (3 - 2 * r));
    if (a.y >= a.yB) {
      w.zone = "lower";
      w.born = simTime;
      attachBody(w, G.cx, a.yB, a.aEnd);
      Body.setVelocity(w.body, { x: rand(-0.2, 0.2) * G.k, y: v / 60 });
      words.push(w);
      a.done = true;
    }
  }
  if (anims.some((a) => a.done)) anims = anims.filter((a) => !a.done);
}

/* ---------- 下半部分 ---------- */

function updateLower(dt) {
  const tr = CONFIG.trace;
  const live = words.filter((w) => w.zone === "lower" && !w.fading && !w.trace);
  if (live.length > CONFIG.maxLowerWords) {
    live.sort((a, b) => a.born - b.born);
    for (let i = 0; i < live.length - CONFIG.maxLowerWords; i++) {
      live[i].fading = true;
      live[i].fadeT = 0;
    }
  }

  // 痕迹太多，或者已经堆到通道出口附近，就让最老的一个淡掉
  const traces = words.filter((w) => w.trace && !w.retiring).sort((a, b) => a.born - b.born);
  const limitY = G.neckBot + G.S * tr.clearance;
  const tooHigh = words.some((w) =>
    w.zone === "lower" && (w.trace || w.body.isSleeping) && w.body.position.y - w.h / 2 < limitY);
  const retiring = words.filter((w) => w.retiring).length;
  if (traces.length && (traces.length > tr.max || tooHigh) && retiring < (tooHigh || traces.length > tr.max + 2 ? 3 : 1)) {
    traces[0].retiring = true;
    traces[0].fadeT = 0;
  }

  for (const w of words.slice()) {
    if (w.fading) {
      w.fadeT += dt;
      const u = Math.min(1, w.fadeT / CONFIG.fade.lowerOverflow);
      w.alpha = lerp(1, tr.alpha, u);
      if (u >= 1) makeTrace(w);
    } else if (w.retiring) {
      w.fadeT += dt;
      w.alpha = tr.alpha * Math.max(0, 1 - w.fadeT / tr.retire);
      if (w.fadeT >= tr.retire) {
        removeWord(w);
        wake("lower");
      }
    }
  }
}

function makeTrace(w) {
  w.fading = false;
  w.trace = true;
  w.alpha = CONFIG.trace.alpha;
}

/* ---------- 交互 ---------- */

function movePushers() {
  const maxStep = G.S * 0.035;
  for (const p of pushers.values()) {
    const b = p.body;
    const ox = b.position.x, oy = b.position.y;
    const dx = p.tx - ox, dy = p.ty - oy, d = Math.hypot(dx, dy);
    const s = d > maxStep ? maxStep / d : 1;
    const nx = ox + dx * s, ny = oy + dy * s;
    Body.setPosition(b, { x: nx, y: ny });
    // 静态物体不会自己更新上一帧位置，手动设好，碰撞才会带出推力
    b.positionPrev.x = ox;
    b.positionPrev.y = oy;
    b.velocity.x = nx - ox;
    b.velocity.y = ny - oy;
    b.speed = Math.hypot(b.velocity.x, b.velocity.y);
    const reach = p.r + G.S * 0.06;
    for (const w of words) {
      const q = w.body.position;
      if (Math.abs(q.x - nx) < reach + w.w / 2 && Math.abs(q.y - ny) < reach + w.w / 2) {
        Sleeping.set(w.body, false);
      }
    }
  }
}

function pointerPos(e) {
  return { x: e.clientX, y: e.clientY };
}

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  const { x, y } = pointerPos(e);
  const r = G.S * CONFIG.pointerRadius;
  const body = Bodies.circle(x, y, r, { isStatic: true, friction: 0.3 });
  Composite.add(world, body);
  pushers.set(e.pointerId, { body, r, tx: x, ty: y });
});
canvas.addEventListener("pointermove", (e) => {
  const p = pushers.get(e.pointerId);
  if (!p) return;
  const { x, y } = pointerPos(e);
  p.tx = x;
  p.ty = y;
});
function endPointer(e) {
  const p = pushers.get(e.pointerId);
  if (!p) return;
  Composite.remove(world, p.body);
  pushers.delete(e.pointerId);
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("lostpointercapture", endPointer);

function clearPushers() {
  for (const p of pushers.values()) Composite.remove(world, p.body);
  pushers.clear();
}

// 禁止滚动、下拉刷新、双指缩放
const stop = (e) => e.preventDefault();
document.addEventListener("touchmove", stop, { passive: false });
document.addEventListener("touchstart", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener("gesturestart", stop);
document.addEventListener("dblclick", stop);
document.addEventListener("contextmenu", stop);
document.addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

/* ---------- 兜底：交互不能破坏过滤 ---------- */

function clampWords() {
  const g = G, maxV = g.S * 0.05;
  for (const w of words) {
    const b = w.body;
    if (b.isStatic) continue;
    const v = b.velocity, sp = Math.hypot(v.x, v.y);
    if (sp > maxV) Body.setVelocity(b, { x: (v.x * maxV) / sp, y: (v.y * maxV) / sp });

    const p = b.position, m = w.h / 2;
    let x = p.x, y = p.y;
    if (w.zone === "upper") {
      y = Math.min(y, g.neckTop - m * 0.5);
      y = Math.max(y, m);
    } else {
      y = Math.max(y, g.neckBot + m * 0.5);
      y = Math.min(y, g.bottom - m * 0.5);
    }
    const half = halfAt(y);
    if (Math.abs(x - g.cx) > half + 1) x = g.cx + Math.sign(x - g.cx) * Math.max(0, half - m);
    x = Math.min(Math.max(x, m), W - m);
    if (x !== p.x || y !== p.y) {
      Body.setPosition(b, { x, y });
      Body.setVelocity(b, { x: 0, y: 0 });
    }
  }
}

/* ---------- 尺寸 ---------- */

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  const old = G;
  G = computeGeometry();
  engine.gravity.scale = 0.001 * G.k * CONFIG.gravity;
  buildWalls();
  if (!old) return;
  clearPushers();
  const f = G.S / old.S;
  for (const w of words) {
    if (w.link) Composite.remove(world, w.link);
    w.link = null;
  }
  for (const w of words) {
    const p = w.body.position, ang = w.body.angle;
    Composite.remove(world, w.body);
    attachBody(w, G.cx + (p.x - old.cx) * f, G.mid + (p.y - old.mid) * f, ang);
  }
  for (const w of words) if (w.next && w.next.body) link(w, w.next);
  // 正被抽进瓶颈的词放回物理世界，下一步重新接管
  if (leader) {
    leader.w.alpha = undefined;
    leader = null;
  }
  for (const a of anims) {
    a.yB = undefined;
    a.y = Infinity;
  }
  updateAnims(0);
  if (active) layoutActive();
}

let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 120);
});

/* ---------- 开场：上半部分堆好，下半部分预置 ---------- */

function prefill() {
  const settle = (steps, each) => {
    for (let i = 0; i < steps; i++) {
      if (each) each(i);
      simTime += STEP;
      updateRibbons();
      Engine.update(engine, 1000 / 60);
      clampWords();
    }
  };

  // 上半部分：一句句从上面落下去，自然堆成一堆软带子
  let guard = 0;
  while (queue.length < CONFIG.minUpperWords && guard++ < 50) {
    const items = nextTokens().map((t) => ({ text: t.text, isKey: t.key, sid: t.sid, sizeRef: randSize() }));
    layoutItems(items);
    let prev = null;
    for (const it of items) {
      const w = { text: it.text, isKey: it.isKey, sid: it.sid, sizeRef: it.sizeRef, zone: "upper", born: simTime };
      attachBody(w, it.x, it.y, 0);
      words.push(w);
      queue.push(w);
      if (prev) link(prev, w);
      prev = w;
    }
    settle(40);
  }
  settle(60);

  // 下半部分先铺一层旧痕迹
  const keys = CONFIG.sentences.flatMap((s) => parseSentence(s).filter((t) => t.key).map((t) => t.text));
  for (let i = 0; i < CONFIG.trace.initial; i++) {
    const w = { text: keys[i % keys.length], isKey: true, sizeRef: randSize(), zone: "lower", born: -1000 + i };
    const y = G.bottom - rand(0.02, 0.14) * G.S;
    attachBody(w, G.cx + rand(-0.7, 0.7) * halfAt(y), y, rand(-0.5, 0.5));
    makeTrace(w);
    words.push(w);
  }
  settle(90);

  // 预置的词从通道出口一个个落到痕迹上
  const pool = [...CONFIG.initialLowerWords, ...keys];
  const n = CONFIG.initialLowerCount;
  settle(n * 12 + 90, (i) => {
    if (i % 12 || i / 12 >= n) return;
    const j = i / 12;
    const w = { text: pool[j % pool.length], isKey: true, sizeRef: randSize(), zone: "lower", born: -100 + j };
    const y = G.neckBot + G.S * rand(0.06, 0.12);
    attachBody(w, G.cx + rand(-0.6, 0.6) * halfAt(y), y, rand(-0.3, 0.3));
    words.push(w);
  });
}

/* ---------- 主循环 ---------- */

function step(dt) {
  simTime += dt;
  if (!active && queue.length < CONFIG.minUpperWords) startDisplay();
  if (active) updateActive(dt);
  updateFlow(dt);
  updateAnims(dt);
  updateLower(dt);
  movePushers();
  updateRibbons();
  Engine.update(engine, 1000 / 60);
  clampWords();
}

function drawText(text, size, x, y, angle, alpha) {
  ctx.globalAlpha = alpha;
  ctx.font = fontStr(size);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillText(text, 0, 0);
}

function drawDebug() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = "#c33";
  ctx.lineWidth = 1;
  for (const b of [...walls, ...[...pushers.values()].map((p) => p.body)]) {
    ctx.beginPath();
    b.vertices.forEach((v, i) => (i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y)));
    ctx.closePath();
    ctx.stroke();
  }
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = CONFIG.colors.background;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = CONFIG.colors.text;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const w of words) {
    const b = w.body;
    drawText(w.text, w.size, b.position.x, b.position.y, b.angle, w.alpha === undefined ? 1 : w.alpha);
  }
  if (active) {
    const alpha = Math.min(1, active.t / 0.35);
    for (const it of active.items) if (!it.released) drawText(it.text, it.size, it.x, it.y, 0, alpha);
  }
  for (const a of anims) {
    if (a.alpha > 0.01) drawText(a.w.text, a.w.size, a.x, a.y, a.a, a.alpha);
  }
  if (DEBUG) drawDebug();
  ctx.globalAlpha = 1;
}

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  let n = 0;
  while (acc >= STEP && n < 4) { step(STEP); acc -= STEP; n++; }
  if (n === 4) acc = 0;
  draw();
  requestAnimationFrame(frame);
}

resize();
prefill();
startDisplay();
requestAnimationFrame((t) => { last = t; frame(t); });
</script>
</body>
</html>
