<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>记忆库推荐 · 首页样张</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  body { min-height: 100svh; }

  /* 星空 */
  .stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .stars circle { fill: var(--night-ink); }
  .stars .tw { animation: twinkle var(--d, 4s) ease-in-out var(--delay, 0s) infinite; }
  @keyframes twinkle { 0%, 100% { opacity: var(--o, .6); } 50% { opacity: .1; } }

  .home {
    position: relative;
    z-index: 1;
    min-height: 100svh;
    padding: var(--s-6) var(--gutter) var(--s-4);
    display: flex;
    flex-direction: column;
  }

  .headline {
    margin: var(--s-5) 0 0;
    align-self: flex-end;
    text-align: right;
    font-family: var(--font-en);
    font-weight: 400;
    font-size: clamp(27px, 7.4vw, 44px);
    line-height: 1.34;
    letter-spacing: -.005em;
  }
  .headline .caps { font-style: normal; letter-spacing: .06em; font-size: .86em; }
  .subtitle {
    margin: var(--s-2) 0 0;
    align-self: flex-end;
    font-family: var(--font-zh);
    font-size: var(--fs-h4, 18px);
    line-height: var(--lh-body);
    letter-spacing: .12em;
    color: var(--night-soft);
  }

  /* 脉冲星图 */
  .pulsar {
    position: relative;
    margin: var(--s-4) calc(var(--gutter) * -1) 0;
    flex: 1;
    min-height: 330px;
    display: flex;
    flex-direction: column;
  }
  .pulsar svg { width: 100%; flex: 1; overflow: visible; }
  .pulsar .ray, .pulsar .bit { stroke: currentColor; stroke-width: .9; fill: none; stroke-linecap: square; }
  .pulsar .ray { opacity: .9; }
  .pulsar .gc { opacity: .55; }
  .bulb { fill: var(--glow); opacity: 0; animation: chase var(--dur) linear var(--delay) infinite; }
  @keyframes chase {
    0%   { opacity: 0; }
    1.5% { opacity: 1; }
    6%   { opacity: 0; }
    100% { opacity: 0; }
  }
  .core-glow { transform-box: fill-box; transform-origin: center; animation: breathe 2.8s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.12); } }
  .callout line { stroke: currentColor; stroke-width: .6; }
  .callout text { fill: currentColor; }
  .callout .en { font-family: var(--font-en); font-size: 11px; letter-spacing: .14em; }
  .callout .zh { font-family: var(--font-zh); font-size: 12px; letter-spacing: .06em; fill: var(--night-soft); }
  .callout a:hover .en, .callout a:focus-visible .en { fill: var(--glow); }

  /* 中心按钮：盖在星图中心上 */
  .core {
    position: absolute;
    width: 64px; height: 64px;
    margin: -32px 0 0 -32px;
    border-radius: 50%;
    z-index: 2;
  }
  .core:focus-visible { outline-color: var(--glow); }


  /* 底部三个小图标 */
  .facts {
    list-style: none; margin: var(--s-3) 0 0; padding: 0;
    display: flex; flex-direction: column; gap: var(--s-2);
    color: var(--ink-soft);
  }
  .facts li { display: flex; align-items: center; gap: var(--s-1); }
  .facts svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.2; }

  /* 点击中心后的转场：亮光铺满屏幕，再进问卷 */
  .flash {
    position: fixed; z-index: 95; width: 20px; height: 20px; margin: -10px 0 0 -10px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--paper) 55%, var(--glow) 72%, transparent 74%);
    transform: scale(0); pointer-events: none;
  }
  .flash.go { transition: transform .75s cubic-bezier(.7, 0, .84, 0); transform: scale(180); }

  /* 纸面版（样张对比用） */
  body.paper-mode { background: var(--paper); color: var(--ink); }
  body.paper-mode .stars circle { fill: var(--deep-plum); }
  body.paper-mode .stars .tw { animation: none; }
  body.paper-mode .subtitle, body.paper-mode .facts,
  body.paper-mode .callout .zh { color: var(--ink-soft); fill: var(--ink-soft); }
  body.paper-mode .bulb { fill: var(--faded-plum); }
  body.paper-mode .menu-btn { color: var(--ink); }

  .sample-switch {
    position: fixed; right: var(--gutter); bottom: var(--s-2); z-index: 60;
    display: flex; gap: var(--s-1); align-items: center;
    padding: var(--s-1) var(--s-2);
    background: color-mix(in srgb, var(--night) 70%, transparent);
    color: var(--night-ink);
    border: var(--line) solid var(--night-soft);
  }
  .sample-switch button { padding: 2px var(--s-1); }
  .sample-switch button[aria-pressed="true"] { color: var(--glow); text-decoration: underline; text-underline-offset: 3px; }
  body.paper-mode .sample-switch { background: color-mix(in srgb, var(--paper) 85%, transparent); color: var(--ink); border-color: var(--rule); }
  body.paper-mode .sample-switch button[aria-pressed="true"] { color: var(--faded-plum); }

  /* 粉色版：颜色由 tokens.css 的 .theme-rose 提供（60 淡灰粉底 / 30 梅红线条和文字 / 10 芥末黄亮光） */
  body.theme-rose .pulsar .ray { stroke: var(--line); opacity: 1; }
  body.theme-rose .pulsar .gc { stroke: var(--rule); opacity: 1; }
  body.theme-rose .pulsar .bit { stroke: var(--ink-soft); }
  body.theme-rose .bulb { fill: var(--bulb); }
  body.theme-rose .core-dot { fill: #fff3d6; }
  body.theme-rose .subtitle, body.theme-rose .facts { color: var(--ink-soft); }
  body.theme-rose .callout line { stroke: var(--ink-soft); }
  body.theme-rose .callout .zh { fill: var(--ink-soft); }
  body.theme-rose .stars circle { fill: var(--line); opacity: .45; }
  body.theme-rose .sample-switch button[aria-pressed="true"] { color: var(--line); }

  /* 梅红版：颜色由 tokens.css 的 .theme-plum 提供（60 梅红底 / 30 浅粉线条和文字 / 10 提亮的芥末黄） */
  body.theme-plum .pulsar .ray { stroke: var(--line); opacity: 1; }
  body.theme-plum .pulsar .gc { stroke: var(--rule); opacity: 1; }
  body.theme-plum .pulsar .bit { stroke: var(--ink-soft); }
  body.theme-plum .bulb { fill: var(--bulb); }
  body.theme-plum .core-dot { fill: #fff3d6; }
  body.theme-plum .subtitle, body.theme-plum .facts { color: var(--ink-soft); }
  body.theme-plum .callout line { stroke: var(--ink-soft); }
  body.theme-plum .callout .zh { fill: var(--ink-soft); }
  body.theme-plum .stars circle { fill: var(--ink); opacity: .55; }
  body.theme-plum .sample-switch button[aria-pressed="true"] { color: var(--line); }
  body.theme-plum .sample-switch { background: color-mix(in srgb, var(--paper) 85%, transparent); color: var(--ink); border-color: var(--line); }
  body.theme-plum .sample-switch button[aria-pressed="true"] { color: var(--bulb); }
  body.theme-plum .callout .en { fill: var(--ink); }
</style>
</head>
<body class="night grain">

<svg class="stars" id="stars" aria-hidden="true"></svg>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="打开导航" aria-expanded="false" aria-controls="drawer">
    <svg viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="M640 192H224c-17.7 0-32-14.3-32-32s14.3-32 32-32h416c17.7 0 32 14.3 32 32s-14.3 32-32 32zM960 544H224c-17.7 0-32-14.3-32-32s14.3-32 32-32h736c17.7 0 32 14.3 32 32s-14.3 32-32 32zM640 896H224c-17.7 0-32-14.3-32-32s14.3-32 32-32h416c17.7 0 32 14.3 32 32s-14.3 32-32 32zM96 192H64c-17.7 0-32-14.3-32-32s14.3-32 32-32h32c17.7 0 32 14.3 32 32s-14.3 32-32 32zM96 544H64c-17.7 0-32-14.3-32-32s14.3-32 32-32h32c17.7 0 32 14.3 32 32s-14.3 32-32 32zM96 896H64c-17.7 0-32-14.3-32-32s14.3-32 32-32h32c17.7 0 32 14.3 32 32s-14.3 32-32 32z"/></svg>
  </button>
</header>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="网站导航" inert>
  <button class="drawer-close" id="drawerClose" aria-label="关闭导航">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><g stroke="currentColor" stroke-width="1.4"><line x1="3" y1="3" x2="17" y2="17"/><line x1="17" y1="3" x2="3" y2="17"/></g></svg>
  </button>
  <p class="caption" style="margin:0;color:var(--ink-faint)">Index</p>
  <ol>
    <li><a href="答题页.html"><span class="caption">I</span>开始问卷</a></li>
    <li><a href="#"><span class="caption">II</span>项目目录</a></li>
    <li><a href="#"><span class="caption">III</span>关于本站</a></li>
    <li><a href="#"><span class="caption">IV</span>作者</a></li>
  </ol>
  <ul class="facts caption-zh" aria-label="网站概况">
    <li><svg viewBox="0 0 18 18" aria-hidden="true"><ellipse cx="9" cy="4.5" rx="6.5" ry="2.5"/><path d="M2.5 4.5v9c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5v-9"/><path d="M2.5 9c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5"/></svg>收录 247 个开源记忆项目</li>
    <li><svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7"/><path d="M9 4.5V9l3 2"/></svg>答完约 5 分钟</li>
    <li><svg viewBox="0 0 18 18" aria-hidden="true"><rect x="3.5" y="8" width="11" height="8"/><path d="M6 8V5.5a3 3 0 0 1 6 0V8"/></svg>答卷只存在你的浏览器里</li>
  </ul>
  <p class="note caption-zh">信息来自各项目的说明文档，未经实际安装验证。</p>
</nav>

<main class="home">
  <h1 class="headline" lang="en">a quick quiz to find<br>the memory patch<br>fitting <em class="caps">YOUR</em> AI agent</h1>
  <p class="subtitle">找到适合你与 AI 共用的记忆库</p>

  <figure class="pulsar" id="pulsarFig">
    <svg id="pulsar" viewBox="-125 -205 400 380" preserveAspectRatio="xMinYMid meet" role="img" aria-label="仿照先驱者号金属板上的脉冲星图">
      <defs>
        <radialGradient id="coreGrad">
          <stop offset="0" stop-color="#fff6dc"/>
          <stop offset=".25" stop-color="var(--glow)"/>
          <stop offset="1" stop-color="var(--glow)" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g id="rays"></g>
      <g id="bulbs"></g>
      <circle class="core-glow" r="16" fill="url(#coreGrad)"/>
      <circle class="core-dot" r="1.8" fill="#fff6dc"/>
      <g class="callout">
        <a href="答题页.html" id="calloutLink">
          <line x1="7" y1="-5.5" x2="124" y2="-110"/>
          <line x1="124" y1="-110" x2="132" y2="-110"/>
          <text class="en" x="136" y="-106.5">START HERE</text>
          <text class="zh" x="136" y="-89">点亮中心，开始答题</text>
        </a>
      </g>
    </svg>
    <a class="core" id="core" href="答题页.html" aria-label="开始问卷"></a>
  </figure>

</main>

<div class="sample-switch caption-zh" role="group" aria-label="样张切换：底色">
  <span>样张底色</span>
  <button type="button" data-mode="night" aria-pressed="true">星空</button>
  <button type="button" data-mode="paper" aria-pressed="false">纸面</button>
  <button type="button" data-mode="rose" aria-pressed="false">粉色</button>
  <button type="button" data-mode="plum" aria-pressed="false">梅红</button>
</div>

<div class="flash" id="flash"></div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 可复现的随机数，每次打开图案一样
  let seed = 19720302;
  const rand = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;

  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };

  /* ---------- 脉冲星图 ----------
     14 条射线（角度：0 为正右，逆时针为正；长度为图上单位）＋一条通向银河中心的水平长线。
     每条线外段是二进制刻度：1 画成垂直短线，0 画成沿线的短横。 */
  const RAYS = [
    [53, 196], [98, 116], [69, 84], [48, 82], [145, 90], [13.5, 104],
    [174.4, 150], [176.6, 128], [198.4, 86], [231, 78], [264, 120],
    [-58.5, 190], [-49, 76], [-17.3, 176],
  ];
  const raysG = document.getElementById("rays");
  const bulbsG = document.getElementById("bulbs");
  const STEP = 0.11; // 每盏灯亮起的间隔（秒）

  el("line", { class: "ray gc", x1: 0, y1: 0, x2: 400, y2: 0 }, raysG);

  RAYS.forEach(([deg, len], i) => {
    const a = deg * Math.PI / 180, ux = Math.cos(a), uy = -Math.sin(a);
    const px = -uy, py = ux; // 垂直方向
    const bits = Array.from({ length: 10 + Math.floor(rand() * 4) }, () => (rand() > .45 ? 1 : 0));
    const binStart = len * (0.5 + rand() * 0.12);
    el("line", { class: "ray", x1: 0, y1: 0, x2: ux * binStart, y2: uy * binStart }, raysG);
    const gap = (len - binStart) / bits.length;
    bits.forEach((b, k) => {
      const r = binStart + gap * (k + 0.5), x = ux * r, y = uy * r;
      if (b) el("line", { class: "bit", x1: x - px * 3, y1: y - py * 3, x2: x + px * 3, y2: y + py * 3 }, raysG);
      else el("line", { class: "bit", x1: x - ux * gap * .32, y1: y - uy * gap * .32, x2: x + ux * gap * .32, y2: y + uy * gap * .32 }, raysG);
    });
    el("line", { class: "bit", x1: ux * len - px * 3, y1: uy * len - py * 3, x2: ux * len + px * 3, y2: uy * len + py * 3 }, raysG);

    // 灯串：从中心往外，每隔一段一盏灯；同一时间每条线只亮一盏
    const spacing = 8;
    const n = Math.floor((len - 6) / spacing);
    const pause = 0.6 + rand() * 1.2;
    const dur = n * STEP + pause;
    const offset = rand() * 3; // 灯串之间的启动时间偏移
    for (let k = 0; k < n; k++) {
      const r = 6 + k * spacing;
      const c = el("circle", { class: "bulb", cx: ux * r, cy: uy * r, r: 1.9 }, bulbsG);
      c.style.setProperty("--dur", dur + "s");
      c.style.setProperty("--delay", (offset + k * STEP - dur) + "s");
    }
  });

  /* ---------- 把中心按钮放到星图中心 ---------- */
  const svg = document.getElementById("pulsar");
  const fig = document.getElementById("pulsarFig");
  const core = document.getElementById("core");
  function placeCore() {
    const m = svg.getScreenCTM(), f = fig.getBoundingClientRect();
    if (!m) return;
    const p = new DOMPoint(0, 0).matrixTransform(m);
    core.style.left = p.x - f.left + "px";
    core.style.top = p.y - f.top + "px";
  }

  /* ---------- 星空 ---------- */
  const stars = document.getElementById("stars");
  function drawStars() {
    stars.replaceChildren();
    const w = innerWidth, h = innerHeight;
    stars.setAttribute("viewBox", `0 0 ${w} ${h}`);
    let s = 7;
    const r2 = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const count = Math.round(w * h / 2600);
    for (let i = 0; i < count; i++) {
      const big = r2() > .93;
      const o = (big ? .75 : .25 + r2() * .45).toFixed(2);
      const c = el("circle", { cx: (r2() * w).toFixed(1), cy: (r2() * h).toFixed(1), r: big ? 1.3 : (.35 + r2() * .55).toFixed(2), opacity: o }, stars);
      if (r2() > .78) {
        c.classList.add("tw");
        c.style.setProperty("--o", o);
        c.style.setProperty("--d", (3 + r2() * 4).toFixed(1) + "s");
        c.style.setProperty("--delay", (-r2() * 6).toFixed(1) + "s");
      }
    }
  }

  let t;
  const layout = () => { drawStars(); placeCore(); };
  addEventListener("resize", () => { clearTimeout(t); t = setTimeout(layout, 120); });
  document.fonts?.ready.then(placeCore);
  layout();

  /* ---------- 点击中心：亮光铺满，再进问卷 ---------- */
  const flash = document.getElementById("flash");
  function launch(e) {
    if (reduce) return;
    e.preventDefault();
    const href = e.currentTarget.getAttribute("href");
    const r = core.getBoundingClientRect();
    flash.style.left = r.left + r.width / 2 + "px";
    flash.style.top = r.top + r.height / 2 + "px";
    flash.classList.add("go");
    setTimeout(() => { location.href = href; }, 720);
  }
  core.addEventListener("click", launch);
  document.getElementById("calloutLink").addEventListener("click", launch);

  /* ---------- 导航 ---------- */
  const btn = document.getElementById("menuBtn"), drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim");
  function setMenu(open) {
    drawer.classList.toggle("open", open);
    scrim.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open);
    drawer.inert = !open;
    if (open) drawer.querySelector("a").focus(); else btn.focus();
  }
  btn.addEventListener("click", () => setMenu(true));
  document.getElementById("drawerClose").addEventListener("click", () => setMenu(false));
  scrim.addEventListener("click", () => setMenu(false));
  addEventListener("keydown", (e) => { if (e.key === "Escape" && drawer.classList.contains("open")) setMenu(false); });

  /* ---------- 样张：星空 / 纸面 / 色卡对比 ---------- */
  document.querySelectorAll(".sample-switch button").forEach((b) => b.addEventListener("click", () => {
    const mode = b.dataset.mode, light = mode !== "night";
    document.body.classList.toggle("night", !light);
    document.body.classList.toggle("paper-mode", light);
    document.body.classList.toggle("paper", light);
    document.body.classList.toggle("theme-rose", mode === "rose");
    document.body.classList.toggle("theme-plum", mode === "plum");
    document.querySelectorAll(".sample-switch button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  }));
  const start = { "#paper": "paper", "#night": "night", "#rose": "rose" }[location.hash] || "plum";
  document.querySelector(`.sample-switch [data-mode="${start}"]`).click();
})();
</script>
</body>
</html>
