<html lang="zh-CN">
<head>

<title>记忆库推荐 · 答题页样张</title>
<script>
  // 在画面出来前决定模式：默认深色；地址带 light 时临时看浅色（截图用）
  (function () {
    var t = "dark";
    try { t = localStorage.getItem("memsite-theme") || "dark"; } catch (e) {}
    if (location.hash.indexOf("light") > -1) t = "light";
    if (t === "dark") document.documentElement.classList.add("theme-dark");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">

<style>
  body { min-height: 100svh; }
  .topbar { background: linear-gradient(var(--paper) 70%, transparent); }

  .quiz { padding: var(--s-5) 0 var(--s-6); max-width: 560px; margin: 0 auto; animation: arrive .6s var(--ease-out) both; }
  /* 从首页的光晕转场过来：底色已经一样，内容再轻轻淡入 */
  @keyframes arrive { from { opacity: 0; transform: translateY(6px); } }

  /* ---------- 进度条：侧看的行星环 ---------- */
  .rings { padding: var(--s-2) 0 0; }
  .rings-bar { position: relative; display: flex; flex-direction: column; gap: 3px; }
  .band { display: flex; gap: 2px; }
  .band i { flex: 1; background: var(--rule); opacity: .7; transition: background-color .6s var(--ease-out), opacity .6s; }
  .band:nth-child(1) { height: 2px; }
  .band:nth-child(2) { height: 6px; }
  .band:nth-child(3) { height: 3px; }
  .band:nth-child(4) { height: 1.5px; }
  .band i.done { opacity: 1; }
  .band:nth-child(1) i.done { background: var(--mustard); }
  .band:nth-child(2) i.done { background: var(--dusty-pink); }
  .band:nth-child(3) i.done { background: var(--mauve); }
  .band:nth-child(4) i.done { background: var(--faded-plum); }
  .rings-marker {
    position: absolute; top: -5px; bottom: -5px; width: var(--line-bold);
    background: var(--ink);
    transition: left .5s var(--ease-out);
  }
  .rings-meta {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 var(--gutter);
    min-height: var(--tap);
    color: var(--ink-soft);
  }
  .arrow { width: var(--tap); height: var(--tap); display: grid; place-items: center; color: var(--ink); }
  /* 箭头图标 16px 居中在 44px 的点按区里，左右各挪 14px，让图标边缘落在 gutter 上，和题目、选项框对齐 */
  #prevTop { margin-left: -14px; }
  #nextTop { margin-right: -14px; }
  .arrow svg { width: 16px; height: 16px; }
  .arrow:disabled { opacity: .25; cursor: default; }
  .rings-meta .where { text-align: center; }

  /* ---------- 题目 ---------- */
  .question { padding: var(--s-2) var(--gutter) 0; }
  .kicker { color: var(--ink-faint); margin: 0; }
  .qtitle {
    margin: var(--s-1) 0 0;
    font-family: var(--font-zh);
    font-weight: 600;
    font-size: var(--fs-h2);
    line-height: var(--lh-h2);
    letter-spacing: var(--ls-zh-title);
  }
  .qhelp { margin: var(--s-2) 0 0; color: var(--ink-soft); font-size: var(--fs-small); line-height: var(--lh-small); max-width: var(--measure); }

  /* ---------- 选项 + 行星环 ---------- */
  .options-wrap { position: relative; margin-top: var(--s-4); }
  /* 环在选项文字下面，卫星在上面一层（只有卫星接收点按）；都裁掉选项区以外的部分 */
  .orbit { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 0; }
  .orbit.top { z-index: 2; }
  .orbit .ring { fill: none; stroke: var(--rule); }
  .orbit .tick { stroke: var(--rule); stroke-width: 1; }
  .orbit .parked { fill: var(--moon-parked); stroke: var(--ink); stroke-width: 1; }
  .moon { pointer-events: auto; cursor: grab; touch-action: none; }
  .moon:active { cursor: grabbing; }
  .moon .body { fill: var(--moon); stroke: var(--ink); stroke-width: 1.2; }
  .moon .hit { fill: transparent; }
  .moon:focus-visible { outline: none; }
  .moon:focus-visible .body { stroke: var(--focus); stroke-width: 2.4; stroke-dasharray: 3 2; }

  .hint { display: flex; align-items: center; gap: var(--s-1); margin: var(--s-2) 0 0; color: var(--ink-faint); transition: opacity .4s; }
  .hint svg { width: 28px; height: 12px; flex: none; }
  .hint.gone { opacity: 0; }
  .hint[hidden], .qhelp[hidden] { display: none; }

  .options { position: relative; z-index: 1; list-style: none; margin: 0; padding: 0 var(--gutter); }
  .options li + li { margin-top: var(--s-1); }
  .opt {
    position: relative;
    display: flex; align-items: center; gap: var(--s-2);
    width: 100%; min-height: var(--tap);
    padding: var(--s-1) var(--s-2);
    text-align: left;
    border: var(--line-bold) solid transparent;
    transition: border-color .25s var(--ease-out);
  }
  .opt .mark {
    flex: none; width: 1em; text-align: center;
    font-family: var(--font-en); color: var(--ink-faint);
  }
  /* 文字底下垫一小块纸色，环线从文字后面穿过 */
  .opt .label { font-family: var(--font-body); background: var(--paper); box-shadow: 0 0 0 3px var(--paper); }
  .opt[aria-checked="true"] { border-color: var(--ink); }
  .opt[aria-checked="true"] .mark { color: var(--ink); }
  .opt .free {
    width: 9em; margin-left: 2px;
    font: inherit; color: var(--ink);
    background: transparent; border: 0;
    border-bottom: var(--line) solid var(--ink-soft);
    padding: 0 2px; border-radius: 0;
  }
  .opt .free::placeholder { color: var(--ink-faint); }
  .opt .free:focus { outline: none; border-bottom-color: var(--focus); }

  /* ---------- 底部 ---------- */
  .foot {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--s-4) var(--gutter) 0;
  }
  .next {
    display: inline-flex; align-items: center; gap: var(--s-2);
    min-height: var(--tap); padding: 0 var(--s-3);
    border: var(--line-bold) solid var(--ink);
    font-family: var(--font-zh); letter-spacing: var(--ls-zh-label);
    transition: background-color .25s, color .25s;
  }
  .next:not(:disabled):hover { background: var(--ink); color: var(--paper); }
  .next:disabled { opacity: .35; cursor: default; }
  .next svg { width: 12px; height: 12px; }
  .privacy { display: flex; gap: var(--s-1); align-items: center; color: var(--ink-faint); }
  .privacy svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.2; }

  .toast {
    position: fixed; left: 50%; bottom: var(--s-3); transform: translate(-50%, 20px);
    padding: var(--s-1) var(--s-3); background: var(--ink); color: var(--paper);
    opacity: 0; transition: opacity .4s, transform .4s var(--ease-out); z-index: 85; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .qcard { transition: opacity .3s var(--ease-out), transform .3s var(--ease-out); }
  .qcard.out { opacity: 0; transform: translateX(-12px); }
  .qcard.in { opacity: 0; transform: translateX(12px); }
</style>

<script src="theme.js"></script>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* 样张只放 4 道题，文字取自 data/questionnaire/questions.json；正式版直接读配置。
     no 是这道题在整份问卷（共 21 题，含追问）里的序号，用来画进度。 */
  const TOTAL = 21;
  const QS = [
    { id: "q1", no: 1, num: "第 1 题", part: "第一部分　模型、设备与入口", type: "multi",
      text: "您目前主要使用哪个厂商提供的模型？",
      options: [["anthropic", "Anthropic（Claude）"], ["openai", "OpenAI（ChatGPT、GPT）"], ["google", "Google（Gemini）"],
        ["glm", "智谱（GLM）"], ["deepseek", "DeepSeek"], ["kimi", "月之暗面（Kimi）"], ["qwen", "阿里（通义千问）"],
        ["doubao", "字节（豆包）"], ["local", "开源模型，本地运行"], ["other", "其它", "free"]] },
    { id: "q4", no: 5, num: "第 4 题", part: "第一部分　模型、设备与入口", type: "single",
      text: "您需要在几个地方共用同一份记忆？",
      options: [["single", "只在手机上的一个入口用"], ["multi", "需要在几个设备或入口之间切换"]] },
    { id: "q7", no: 9, num: "第 7 题", part: "第二部分　使用习惯", type: "rank",
      text: "您常和 Agent 共同进行什么活动？", help: "按顺序点选，越靠前越重要。",
      options: [["companion", "聊天与陪伴"], ["roleplay", "角色扮演或创作"], ["schedule", "日程规划与管理"],
        ["work", "工作断线续做"], ["coding", "轻量编程"], ["other", "其他", "free"]] },
    { id: "q8a", no: 11, num: "第 8a 题", part: "第二部分　使用习惯", type: "multi",
      text: "您发给 Agent 的图片、语音或视频，希望记忆库存下原件，以后还能找回来吗？",
      help: "大多数记忆库只把图片、语音转成文字描述再存，原件找不回来。能存原件的项目目前只有十几个，选了会优先推荐它们。",
      options: [["image", "要，图片（照片、截图）"], ["audio", "要，语音"], ["video", "要，视频"], ["none", "不需要，记下文字内容就够了", "exclusive"]] },
  ];
  const TYPE_NOTE = { single: "单选", multi: "可多选", rank: "可多选，按重要程度排序" };

  /* ---------- 续答：答案存在浏览器里 ---------- */
  const KEY = "memquiz-sample-v1";
  let state = { i: 0, answers: {}, free: {} };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.answers) state = s; } catch (e) {}
  // 截图用：地址后加 #demo 会预先选好几项
  if (/^#demo(-light)?$/.test(location.hash)) state = { i: 0, answers: { q1: ["openai", "deepseek"] }, free: {}, hinted: true };
  if (location.hash.indexOf("demo-rank") > -1) state = { i: 2, answers: { q1: ["openai"], q4: ["multi"], q7: ["companion", "work", "roleplay"] }, free: {}, hinted: true };
  const restored = Object.keys(state.answers).length > 0;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };

  /* ---------- 进度条 ---------- */
  const bands = [...document.querySelectorAll(".band")];
  bands.forEach((b) => { for (let k = 0; k < TOTAL; k++) b.appendChild(document.createElement("i")); });
  function drawProgress() {
    const q = QS[state.i];
    const done = new Set(QS.filter((x) => (state.answers[x.id] || []).length).map((x) => x.no));
    // 样张里没放的题，当作已经答过（它们排在当前题之前时）
    for (let n = 1; n < q.no; n++) if (!QS.some((x) => x.no === n)) done.add(n);
    bands.forEach((b) => [...b.children].forEach((seg, k) => seg.classList.toggle("done", done.has(k + 1))));
    $("marker").style.left = `calc(${((q.no - 1) / TOTAL) * 100}% - 0.75px)`;
    $("where").textContent = `${q.part}　${q.no} / ${TOTAL}`;
  }

  /* ---------- 行星环几何 ----------
     环心在屏幕右侧之外；每个选项行与外环相交的位置就是卫星停靠的位置。
     环整体绕环心转动：转角 a 时，卫星在 (cx - R cos a, cy - R sin a)。 */
  let geo = null, rot = 0, tween = null;

  function layoutOrbit() {
    const wrap = $("wrap"), svg = $("orbit");
    const W = wrap.clientWidth;
    const rows = [...$("options").children].map((li) => ({ y: li.offsetTop + li.offsetHeight / 2, right: li.offsetLeft + li.offsetWidth }));
    if (!rows.length) return;
    const top = rows[0].y, bottom = rows[rows.length - 1].y, H = bottom - top;
    const cy = (top + bottom) / 2;
    const R = Math.max(H * 0.56 + 22, 150);
    const dyMax = H / 2;
    const gutter = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gutter")) || 16;
    const limit = W - gutter - 22;                 // 卫星不能超出选项框
    const cx = Math.min(W * 0.66 + R, limit + Math.sqrt(R * R - dyMax * dyMax));
    const angles = rows.map((r) => Math.asin((cy - r.y) / R));
    geo = { W, cx, cy, R, rows, angles, min: angles[angles.length - 1] - 0.04, max: angles[0] + 0.04 };

    const top2 = $("orbitTop");
    svg.replaceChildren();
    top2.replaceChildren();
    svg.setAttribute("viewBox", `0 0 ${W} ${wrap.clientHeight}`);
    top2.setAttribute("viewBox", `0 0 ${W} ${wrap.clientHeight}`);
    const g = el("g", { id: "ringG" }, svg);
    el("circle", { class: "ring", cx, cy, r: R + 9, "stroke-width": 1 }, g);
    el("circle", { class: "ring", cx, cy, r: R, "stroke-width": 2.2 }, g);
    el("circle", { class: "ring", cx, cy, r: R - 13, "stroke-width": 1 }, g);
    for (let d = 0; d < 360; d += 7.5) {           // 刻度跟着环一起转，看得出在转动
      const t = d * Math.PI / 180, long = d % 30 === 0;
      el("line", { class: "tick", x1: cx + (R - 13) * Math.cos(t), y1: cy + (R - 13) * Math.sin(t),
        x2: cx + (R - 13 + (long ? 9 : 4)) * Math.cos(t), y2: cy + (R - 13 + (long ? 9 : 4)) * Math.sin(t) }, g);
    }
    el("g", { id: "parked" }, top2);
    const moonG = el("g", { id: "moonG" }, top2);
    const moon = el("g", { class: "moon", id: "moon", tabindex: 0, role: "slider", "aria-label": "卫星：拖动来选择选项" }, moonG);
    el("circle", { class: "hit", cx: cx - R, cy, r: 24 }, moon);
    el("circle", { class: "body", cx: cx - R, cy, r: 9 }, moon);

    bindMoon(moon);
    setRotation(currentTargetAngle(), false);
    drawParked();
  }

  function currentTargetAngle() {
    const q = QS[state.i], sel = state.answers[q.id] || [];
    if (!sel.length) return 0;
    const idx = q.options.findIndex((o) => o[0] === sel[sel.length - 1]);
    return idx >= 0 ? geo.angles[idx] : 0;
  }

  function setRotation(a, animate = true) {
    if (!geo) return;
    const gs = [$("ringG"), $("moonG")];
    const apply = (v) => {
      rot = v;
      const t = `rotate(${(v * 180 / Math.PI).toFixed(3)} ${geo.cx} ${geo.cy})`;
      gs.forEach((g) => g.setAttribute("transform", t));
    };
    cancelAnimationFrame(tween);
    if (!animate || reduce) return apply(a);
    const from = rot, t0 = performance.now(), dur = 520;
    const step = (now) => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      apply(from + (a - from) * e);
      if (p < 1) tween = requestAnimationFrame(step);
    };
    tween = requestAnimationFrame(step);
  }

  // 多选、排序：已选的选项在框里停一颗小卫星
  function drawParked() {
    const q = QS[state.i], g = $("parked");
    if (!g) return;
    g.replaceChildren();
    if (q.type === "single") return;
    const sel = state.answers[q.id] || [];
    sel.forEach((id) => {
      const idx = q.options.findIndex((o) => o[0] === id);
      const a = geo.angles[idx];
      el("circle", { class: "parked", cx: geo.cx - geo.R * Math.cos(a), cy: geo.cy - geo.R * Math.sin(a), r: 5 }, g);
    });
  }

  /* ---------- 拖动卫星 ---------- */
  function bindMoon(moon) {
    let dragging = false, startA = 0, startRot = 0;
    const angleAt = (e) => {
      const r = $("orbitTop").getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      return Math.atan2(geo.cy - y, geo.cx - x);  // 正左为 0，向上为正
    };
    moon.addEventListener("pointerdown", (e) => {
      dragging = true; moon.setPointerCapture(e.pointerId);
      startA = angleAt(e); startRot = rot; cancelAnimationFrame(tween);
      hideHint();
    });
    moon.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const a = Math.min(geo.max, Math.max(geo.min, startRot + (angleAt(e) - startA)));
      setRotation(a, false);
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      // 停在哪里就选哪一项
      let best = 0;
      geo.angles.forEach((a, k) => { if (Math.abs(a - rot) < Math.abs(geo.angles[best] - rot)) best = k; });
      choose(best, "drag");
    };
    moon.addEventListener("pointerup", end);
    moon.addEventListener("pointercancel", end);
    moon.addEventListener("keydown", (e) => {
      const q = QS[state.i];
      let cur = 0;
      geo.angles.forEach((a, k) => { if (Math.abs(a - rot) < Math.abs(geo.angles[cur] - rot)) cur = k; });
      if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); setRotation(geo.angles[Math.min(q.options.length - 1, cur + 1)]); }
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); setRotation(geo.angles[Math.max(0, cur - 1)]); }
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(cur, "key"); }
    });
  }

  function hideHint() {
    if (state.hinted) return;
    state.hinted = true; save();
    const h = $("hint");
    h.classList.add("gone");
    setTimeout(() => { h.hidden = true; layoutOrbit(); }, reduce ? 0 : 420);
  }

  /* ---------- 选择 ---------- */
  function choose(idx, via) {
    const q = QS[state.i], id = q.options[idx][0], exclusive = q.options[idx][2] === "exclusive";
    let sel = [...(state.answers[q.id] || [])];
    if (q.type === "single") sel = [id];
    else if (sel.includes(id)) sel = sel.filter((x) => x !== id);
    else if (exclusive) sel = [id];
    else sel = sel.filter((x) => q.options.find((o) => o[0] === x)[2] !== "exclusive").concat(id);
    state.answers[q.id] = sel;
    save();
    hideHint();
    setRotation(geo.angles[idx]);
    renderMarks();
    drawParked();
    drawProgress();
    updateNav();
    if (q.options[idx][2] === "free" && sel.includes(id) && via !== "input") $("options").children[idx].querySelector("input")?.focus();
  }

  function renderMarks() {
    const q = QS[state.i], sel = state.answers[q.id] || [];
    [...$("options").children].forEach((li, k) => {
      const b = li.firstElementChild, on = sel.includes(q.options[k][0]);
      b.setAttribute("aria-checked", on);
      b.querySelector(".mark").textContent = q.type === "rank" && on ? sel.indexOf(q.options[k][0]) + 1 : "–";
    });
  }

  /* ---------- 渲染一道题 ---------- */
  function render() {
    const q = QS[state.i];
    $("kicker").textContent = `${q.num} · ${TYPE_NOTE[q.type]}`;
    $("qtitle").textContent = q.text;
    $("qhelp").textContent = q.help || "";
    $("qhelp").hidden = !q.help;
    const ul = $("options");
    ul.replaceChildren();
    ul.setAttribute("role", q.type === "single" ? "radiogroup" : "group");
    ul.setAttribute("aria-labelledby", "qtitle");
    q.options.forEach(([id, label, flag], k) => {
      const li = document.createElement("li");
      const b = document.createElement("div");
      b.className = "opt";
      b.tabIndex = 0;
      b.setAttribute("role", q.type === "single" ? "radio" : "checkbox");
      b.innerHTML = `<span class="mark" aria-hidden="true">–</span><span class="label"></span>`;
      b.querySelector(".label").textContent = flag === "free" ? label + "：" : label;
      if (flag === "free") {
        const inp = document.createElement("input");
        inp.className = "free"; inp.placeholder = "请填写"; inp.value = state.free[q.id] || "";
        inp.setAttribute("aria-label", label + "，请填写");
        inp.addEventListener("click", (e) => e.stopPropagation());
        inp.addEventListener("keydown", (e) => e.stopPropagation());
        inp.addEventListener("input", () => {
          state.free[q.id] = inp.value; save();
          const on = (state.answers[q.id] || []).includes(id);
          if (inp.value && !on) choose(k, "input");
        });
        b.appendChild(inp);
      }
      b.addEventListener("click", () => choose(k, "click"));
      b.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); choose(k, "click"); } });
      li.appendChild(b);
      ul.appendChild(li);
    });
    renderMarks();
    drawProgress();
    updateNav();
    requestAnimationFrame(layoutOrbit);
  }

  function updateNav() {
    const answered = (state.answers[QS[state.i].id] || []).length > 0;
    $("prevTop").disabled = state.i === 0;
    $("nextTop").disabled = !answered;
    $("next").disabled = !answered;
    $("next").firstChild.textContent = state.i === QS.length - 1 ? "完成样张" : "下一题";
  }

  function go(d) {
    const n = state.i + d;
    if (n < 0) return;
    if (n >= QS.length) { toast("样张到此为止，正式版接着是结果页"); return; }
    const card = $("card");
    const swap = () => { state.i = n; save(); render(); window.scrollTo({ top: 0 }); };
    if (reduce) return swap();
    card.classList.add("out");
    setTimeout(() => { swap(); card.classList.remove("out"); card.classList.add("in"); requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove("in"))); }, 260);
  }
  $("prevTop").addEventListener("click", () => go(-1));
  $("nextTop").addEventListener("click", () => go(1));
  $("next").addEventListener("click", () => go(1));

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
  }

  /* ---------- 导航 ---------- */
  const btn = $("menuBtn"), drawer = $("drawer"), scrim = $("scrim");
  function setMenu(open) {
    drawer.classList.toggle("open", open); scrim.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open); drawer.inert = !open;
    if (open) drawer.querySelector("a").focus(); else btn.focus();
  }
  btn.addEventListener("click", () => setMenu(true));
  $("drawerClose").addEventListener("click", () => setMenu(false));
  scrim.addEventListener("click", () => setMenu(false));
  addEventListener("keydown", (e) => { if (e.key === "Escape" && drawer.classList.contains("open")) setMenu(false); });

  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layoutOrbit, 120); });
  document.fonts?.ready.then(layoutOrbit);

  render();
  if (location.hash.indexOf("menu") > -1) setMenu(true); // 截图用
  if (state.hinted) { $("hint").hidden = true; requestAnimationFrame(layoutOrbit); }
  if (restored) toast("已接着您上次的进度");
})();
</script>
</body>
</html>
